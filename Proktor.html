<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" id="pwa-manifest">

  <title>CBT - Portal Pengawas / Proktor</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "lucide-react": "https://esm.sh/lucide-react@0.378.0?deps=react@18.3.1,react-dom@18.3.1"
      }
    }
  </script>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .z-max { z-index: 9999; }
  </style>
  <script>
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      document.write('<script src="./gas-config.js"><\/script><script src="./gas-bridge.js"><\/script>');
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen overflow-x-hidden overflow-y-auto">
  <div id="root"></div>

  <script>
    const manifest = {
        name: "CBT Proktor Pengawas",
        short_name: "Proktor CBT",
        display: "standalone",
        background_color: "#f8fafc",
        theme_color: "#4f46e5",
        icons: [{"src": "https://cdn-icons-png.flaticon.com/512/3135/3135679.png", "sizes": "512x512", "type": "image/png"}]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
  </script>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Users, Activity, Unlock, RefreshCw, LogOut, CheckCircle, AlertCircle, ShieldAlert, MonitorPlay, XCircle, Key, FileText, Eye, EyeOff, Camera, Mic, Monitor, UserCheck, MapPin } from 'lucide-react';

    // ===== FOOTER SECURITY - INTEGRITY GUARD (ANTI-TAMPER) =====
    const _F = (() => {
        const H = '4372656174656420616e642044657369676e206279204a6573736520522e4e696b696a756c75772c2053542e';
        let t = '';
        for (let i = 0; i < H.length; i += 2)
            t += String.fromCharCode(parseInt(H.substring(i, i+2), 16));
        return t;
    })();
    const _hA = '87709f63';
    const _hB = '753dfc15';
    const _footerHash = _hA + _hB;
    const _breakApp = (code) => {
        try {
            const r = document.getElementById('root');
            if (r) r.innerHTML = '';
            document.title = 'APLIKASI DINONAKTIFKAN - INTEGRITAS TERGANGGU';
        } catch(e) {}
        throw new Error('Integritas aplikasi terganggu (Kode: ' + code + ')');
    };
    const _verifyFooter = (() => {
        let _armed = false;
        let _miss = 0;
        setInterval(() => {
            try {
                const el = document.getElementById('app-footer');
                if (!el) { if (_armed || ++_miss >= 5) return _breakApp('E01'); return; }
                const txt = (el.textContent || '').trim();
                if (!txt.includes(_F)) { if (_armed || ++_miss >= 5) return _breakApp('E02'); return; }
                let h1 = 0x811c9dc5, h2 = 0x01000193;
                for (let i = 0; i < txt.length; i++) {
                    const c = txt.charCodeAt(i);
                    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
                    h2 = Math.imul(h2 ^ c, 0x01000193) >>> 0;
                }
                const hash = ('00000000' + h1.toString(16)).slice(-8) + ('00000000' + h2.toString(16)).slice(-8);
                if (hash !== _footerHash) { if (_armed || ++_miss >= 5) return _breakApp('E03'); return; }
                _armed = true;
                _miss = 0;
            } catch(e) {}
        }, 10000);
        return () => {};
    })();

    const Footer = () => {
        
        return (
            <div id="app-footer" className="text-center text-[10px] font-bold text-slate-400 leading-relaxed px-2 py-2 border-t border-slate-200/60">
                &copy; 2026 Created and Design by Jesse R.Nikijuluw, ST. All rights reserved.
            </div>
        );
    };

    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
          return localStorage.getItem('cbt_proktor_session') !== null;
      });
      const [proktorName, setProktorName] = useState(() => {
          const session = localStorage.getItem('cbt_proktor_session');
          return session ? JSON.parse(session).nama : '';
      });

      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [isLoading, setIsLoading] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      
      const [dataSiswa, setDataSiswa] = useState([]);
      const [dataLog, setDataLog] = useState([]);
      const [dataJadwal, setDataJadwal] = useState([]);
      const [dataFoto, setDataFoto] = useState([]); 
      const [dataRuang, setDataRuang] = useState({});
      const [dataProgress, setDataProgress] = useState({});
      const [filterKelas, setFilterKelas] = useState('Semua');
      const [filterRuang, setFilterRuang] = useState('');
      const [filterStatus, setFilterStatus] = useState('Semua');
      const [toast, setToast] = useState({ show: false, msg: '', type: 'success' });
      const [actionStatus, setActionStatus] = useState('');
      const [showPassword, setShowPassword] = useState(false);

      const [appSettings, setAppSettings] = useState({
          nama_instansi: 'KEMENTERIAN PENDIDIKAN',
          nama_sekolah: 'NAMA SEKOLAH',
          logo_sekolah: '',
          token: ''
      });

      useEffect(() => {
          if (typeof google !== 'undefined' && google.script) {
              google.script.run.withSuccessHandler((res) => {
                  if(res.success && res.data) setAppSettings(prev => ({...prev, ...res.data}));
              }).getAppSettings();
          }

          if (isLoggedIn) {
              fetchDashboardData();
          }
      }, []);

      useEffect(() => {
          let poll;
          if (isLoggedIn) {
              poll = setInterval(() => {
                  if (typeof google !== 'undefined' && google.script) {
                      google.script.run.withSuccessHandler((res) => {
                          if (res.success) {
                              setDataSiswa(res.data.siswa || []);
                              setDataLog(res.data.log || []);
                              setDataFoto(res.data.foto || []);
                              if (res.data.ruangMap) setDataRuang(res.data.ruangMap);
                              if (res.data.progressMap) setDataProgress(res.data.progressMap);
                          }
                      }).getProktorDashboardData();
                  }
              }, 5000); 
          }
          return () => clearInterval(poll);
      }, [isLoggedIn]);

      const showToast = (msg, type = 'success') => {
        setToast({ show: true, msg, type });
        setTimeout(() => setToast({ show: false, msg: '', type: 'success' }), 4000);
      };

      const executeWithRetry = (actionName, params, successMsg, attempt = 1) => {
        setIsSyncing(true);
        const maxAttempts = 5;
        const delay = attempt * 2000;

        if(attempt > 1) setActionStatus(`Antrean sibuk. Mengulang perintah... (${attempt}/${maxAttempts})`);

        if (typeof google !== 'undefined' && google.script) {
            google.script.run
                .withSuccessHandler((res) => {
                    if (res.success) {
                        showToast(successMsg || res.message);
                        if (actionName === 'updateTokenUjian') setAppSettings(prev => ({...prev, token: params[0]}));
                        fetchDashboardData();
                        setActionStatus('');
                    } else if (res.message && res.message.includes('Padat') && attempt < maxAttempts) {
                        setTimeout(() => executeWithRetry(actionName, params, successMsg, attempt + 1), delay);
                    } else {
                        showToast(res.message, 'error');
                        setIsSyncing(false);
                        setActionStatus('');
                    }
                })
                .withFailureHandler(() => {
                    if (attempt < maxAttempts) {
                        setTimeout(() => executeWithRetry(actionName, params, successMsg, attempt + 1), delay);
                    } else {
                        showToast("Koneksi server sibuk/gagal. Harap coba beberapa detik lagi.", 'error');
                        setIsSyncing(false);
                        setActionStatus('');
                    }
                })
                [actionName](...params);
        } else {
            setIsSyncing(false);
            setActionStatus('');
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setIsLoading(true);
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((res) => {
              if (res.success) {
                setProktorName(res.nama);
                setIsLoggedIn(true);
                localStorage.setItem('cbt_proktor_session', JSON.stringify({ nama: res.nama }));
                fetchDashboardData();
              } else {
                showToast(res.message, 'error');
              }
              setIsLoading(false);
            })
            .withFailureHandler((err) => {
              showToast("Gagal terhubung ke server.", "error");
              setIsLoading(false);
            })
            .loginProktor(loginForm.username, loginForm.password);
        } else {
          setIsLoading(false);
          showToast('Bukan di env Google Apps Script', 'error');
        }
      };

      const handleLogout = () => {
          if(window.confirm("Apakah Anda yakin ingin keluar dari dasbor pengawas?")) {
              localStorage.removeItem('cbt_proktor_session');
              setIsLoggedIn(false);
              setProktorName('');
          }
      };

      const fetchDashboardData = (attempt = 1) => {
        setIsSyncing(true);
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((res) => {
              if (res.success) {
                setDataSiswa(res.data.siswa || []);
                setDataLog(res.data.log || []);
                setDataJadwal(res.data.jadwal || []);
                setDataFoto(res.data.foto || []);
                setDataRuang(res.data.ruangMap || {});
                setDataProgress(res.data.progressMap || {});
                if (res.data.settings) {
                    setAppSettings(prev => ({...prev, ...res.data.settings}));
                }
                setIsSyncing(false);
              } else {
                if(attempt < 4) setTimeout(() => fetchDashboardData(attempt + 1), 2000);
                else { showToast("Gagal merefresh data.", "error"); setIsSyncing(false); }
              }
            })
            .withFailureHandler(() => {
              if(attempt < 4) setTimeout(() => fetchDashboardData(attempt + 1), 2000);
              else { showToast("Gagal merefresh data jaringan.", "error"); setIsSyncing(false); }
            })
            .getProktorDashboardData();
        }
      };

      const handleImporLJKHybrid = () => {
        const nis = prompt("Masukkan NIS Siswa yang mengerjakan di Lembar Jawaban Kertas (LJK OMR):");
        if (!nis) return;
        const siswaFound = dataSiswa.find(s => String(s[0]).trim() === String(nis).trim());
        const nama = siswaFound ? siswaFound[1] : prompt("Masukkan Nama Siswa:", "Siswa Hybrid");
        const score = prompt(`Masukkan Skor Hasil Scan / Koreksi LJK untuk NIS ${nis} (${nama}):`, "80");
        if (score === null) return;

        setIsSyncing(true);
        google.script.run
          .withSuccessHandler((res) => {
             setIsSyncing(false);
             if (res && res.success) {
                 showToast(res.message);
                 fetchDashboardData();
             } else showToast(res?.message || "Gagal simpan LJK", "error");
          })
          .withFailureHandler(() => { setIsSyncing(false); showToast("Gagal koneksi server", "error"); })
          .submitJawabanHybridLJK(nis, nama, appSettings.token || 'HYBRID-OMR', score, 'Selesai (OMR Kertas)', '{}', 'Ujian Kertas (Hybrid CBT)');
      };

      const handleUnlockSiswa = (nis) => {
          executeWithRetry('unlockSiswa', [nis], `Sesi login & kunci perangkat NIS ${nis} berhasil di-reset.`);
      };

      const handleForceSelesai = (nis) => {
        if(!window.confirm(`Yakin ingin mematikan ujian untuk NIS ${nis}? Ujian siswa akan disubmit otomatis (Jawaban sementara diselamatkan).`)) return;
        executeWithRetry('forceSelesaiUjian', [nis], `Ujian siswa NIS ${nis} berhasil dimatikan paksa.`);
      };

      const handleRefreshToken = () => {
        if(!window.confirm("Buat Token Ujian Baru? Semua siswa yang sedang menunggu login harus menggunakan token ini.")) return;
        const randomToken = Math.random().toString(36).substring(2, 8).toUpperCase();
        executeWithRetry('updateTokenUjian', [randomToken], `Token berhasil diperbarui: ${randomToken}`);
      };

      const getMyTaskInfo = () => {
        if (dataJadwal.length === 0) return null;
        const myJadwal = dataJadwal.find(j => j[9] && j[9].toString().toLowerCase() === proktorName.toLowerCase());
        return myJadwal || null;
      };

      const normNisExact = (v) => String(v || '').trim().replace(/^'+/, '').toLowerCase();
      const normNisNoZero = (v) => String(v || '').trim().replace(/^'+/, '').replace(/^0+(?=\d)/, '').toLowerCase();
      const isSameNis = (a, b) => {
        const ea = normNisExact(a);
        const eb = normNisExact(b);
        if (!ea || !eb) return false;
        return ea === eb || normNisNoZero(ea) === normNisNoZero(eb);
      };

      const getStudentPhoto = (nis) => {
         const match = [...dataFoto].reverse().find(f => isSameNis(f[1], nis));
         return match ? match[3] : null; 
      };

      const normalizeRoomName = (val) => {
        let s = String(val || '')
          .toLowerCase()
          .trim()
          .replace(/[-_.]+/g, ' ')
          .replace(/\s+/g, ' ')
          .replace(/\b0+(\d+)/g, '$1');
        // Jika siswa hanya menulis "1", "01", "r1", atau "r 1", samakan menjadi "ruang 1"
        const numOnly = s.match(/^(?:r\s*)?(\d+)$/i);
        if (numOnly) return 'ruang ' + numOnly[1];
        const ruangNum = s.match(/^ruang\s*(\d+)$/i);
        if (ruangNum) return 'ruang ' + ruangNum[1];
        return s;
      };

      const matchRoomQuery = (studentRoom, query) => {
        if (!query) return true;
        if (query === '__BELUM_ISI__') return !String(studentRoom || '').trim();
        const q = normalizeRoomName(query);
        if (!q) return true;
        const r = normalizeRoomName(studentRoom);
        if (!r) return false;
        return r === q;
      };

      const defaultRuang1To14 = Array.from({ length: 14 }, (_, idx) => `Ruang ${idx + 1}`);
      const formatPrettyRoom = (val) => {
        const clean = String(val || '').trim();
        if (!clean) return '';
        const norm = normalizeRoomName(clean);
        const m = norm.match(/^ruang (\d+)$/);
        return m ? `Ruang ${parseInt(m[1], 10)}` : clean;
      };
      const ruangByNisKey = {};
      Object.entries(dataRuang || {}).forEach(([k, v]) => {
        const exactK = normNisExact(k);
        const noZeroK = normNisNoZero(k);
        const prettyV = formatPrettyRoom(v);
        if (exactK && prettyV) {
          ruangByNisKey[exactK] = prettyV;
          if (noZeroK) ruangByNisKey[noZeroK] = prettyV;
        }
      });
      const progressByNisKey = {};
      Object.entries(dataProgress || {}).forEach(([k, v]) => {
        const exactK = normNisExact(k);
        const noZeroK = normNisNoZero(k);
        if (exactK && v) {
          progressByNisKey[exactK] = v;
          if (noZeroK) progressByNisKey[noZeroK] = v;
        }
      });
      const getStudentRoom = (nis) => ruangByNisKey[normNisExact(nis)] || ruangByNisKey[normNisNoZero(nis)] || '';
      const getStudentProgress = (nis) => progressByNisKey[normNisExact(nis)] || progressByNisKey[normNisNoZero(nis)] || null;

      // Samakan daftar Ruang 1 s/d Ruang 14 persis seperti CBT Siswa (ditambah ruang lain hanya jika siswa benar-benar menginput di CBT)
      const rawRoomSources = [
        ...defaultRuang1To14,
        ...Object.values(ruangByNisKey)
      ];
      const uniqueRoomsMap = new Map();
      rawRoomSources.forEach(rawVal => {
        const clean = String(rawVal || '').trim();
        if (!clean || /^ruang$/i.test(clean) || /^semua$/i.test(clean) || clean === '-') return;
        const norm = normalizeRoomName(clean);
        if (norm && !uniqueRoomsMap.has(norm)) {
          const prettyRuang = norm.match(/^ruang (\d+)$/);
          uniqueRoomsMap.set(norm, prettyRuang ? `Ruang ${parseInt(prettyRuang[1], 10)}` : clean);
        }
      });
      const listRuang = Array.from(uniqueRoomsMap.values()).sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));

      const cleanStudentsList = Array.isArray(dataSiswa) ? dataSiswa.filter(s => s && s[0] && String(s[0]).trim().toUpperCase() !== 'NIS') : [];
      const listKelas = ['Semua', ...new Set(cleanStudentsList.map(s => s[2]).filter(Boolean))];
      const studentsMatchingKelas = cleanStudentsList.filter(s => filterKelas === 'Semua' || s[2] === filterKelas);
      const countNoRoom = studentsMatchingKelas.filter(s => !getStudentRoom(s[0])).length;
      const populatedRoomsSummary = listRuang
        .map(rm => {
          const inRoom = studentsMatchingKelas.filter(s => matchRoomQuery(getStudentRoom(s[0]), rm));
          const liveInRoom = inRoom.filter(s => s[5] === 'Sedang Ujian').length;
          return { room: rm, total: inRoom.length, live: liveInRoom };
        })
        .filter(item => item.total > 0);
      const studentsMatchingRoom = studentsMatchingKelas.filter(s => {
        const studentRoom = getStudentRoom(s[0]);
        return matchRoomQuery(studentRoom, filterRuang);
      });
      const liveStudents = studentsMatchingRoom.filter(s => s[5] === 'Sedang Ujian');
      const filteredStudents = studentsMatchingRoom.filter(s => {
        if (filterStatus === 'Live') return s[5] === 'Sedang Ujian';
        if (filterStatus === 'Selesai') return s[5] === 'Selesai';
        if (filterStatus === 'Offline') return !s[5] || (s[5] !== 'Sedang Ujian' && s[5] !== 'Selesai');
        return true;
      });
      const countOnline = liveStudents.length;
      const countDone = studentsMatchingRoom.filter(s => s[5] === 'Selesai').length;
      const formatShortTime = (secs) => {
        const s = parseInt(secs, 10) || 0;
        if (s <= 0) return '-';
        const m = Math.floor(s / 60);
        const r = s % 60;
        return `${m}m ${String(r).padStart(2, '0')}s`;
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-900 p-5 relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-1/2 bg-indigo-900/30 rounded-b-[100%] blur-3xl transform -translate-y-1/2"></div>
            
            <div className="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-sm border-t-8 border-indigo-600 relative z-10">
              
              <div className="text-center mb-6">
                {appSettings.logo_sekolah && (
                    <img src={appSettings.logo_sekolah} alt="Logo" className="h-16 w-auto mx-auto object-contain mb-3" />
                )}
                <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{appSettings.nama_instansi}</h3>
                <h2 className="text-sm font-black text-indigo-700 uppercase">{appSettings.nama_sekolah}</h2>
              </div>

              <div className="w-full h-px bg-slate-200 mb-6"></div>

              <div className="flex flex-col items-center justify-center mx-auto mb-4 text-slate-700"><MonitorPlay size={28} /></div>
              <h2 className="text-xl font-black text-center text-slate-800 mb-1">Login Proktor</h2>
              <p className="text-center text-xs text-slate-500 mb-6 font-medium">Portal Pengawasan Ujian CBT</p>
              
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="text-[11px] font-bold text-slate-600 uppercase">Username Pengawas</label>
                  <input type="text" required className="w-full mt-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-bold text-slate-700" value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} />
                </div>
                <div>
                  <label className="text-[11px] font-bold text-slate-600 uppercase">Password</label>
                  <div className="relative mt-1">
                    <input 
                      type={showPassword ? "text" : "password"} 
                      required 
                      className="w-full px-4 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-bold text-slate-700" 
                      value={loginForm.password} 
                      onChange={e => setLoginForm({...loginForm, password: e.target.value})} 
                    />
                    <button 
                      type="button" 
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none transition-colors"
                      title={showPassword ? "Sembunyikan Password" : "Tampilkan Password"}
                    >
                      {showPassword ? <EyeOff size={18} /> : <Eye size={18} />}
                    </button>
                  </div>
                </div>
                <button disabled={isLoading} className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2 mt-2 disabled:opacity-70 disabled:cursor-not-allowed">
                  {isLoading ? <RefreshCw className="animate-spin" size={18} /> : 'Masuk Dashboard'}
                </button>
              </form>

              <div className="mt-6 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest border-t border-slate-100 pt-4">
                <Footer />
              </div>
            </div>
            
            {toast.show && (
              <div className="fixed top-6 left-1/2 -translate-x-1/2 bg-rose-600 text-white px-6 py-3 rounded-full text-sm font-bold shadow-lg z-max flex items-center gap-2">
                <AlertCircle size={18} /> {toast.msg}
              </div>
            )}
          </div>
        );
      }

      const myTask = getMyTaskInfo();

      return (
        <div className="h-screen flex flex-col bg-slate-100 overflow-hidden relative">
          <header className="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center shadow-md z-10 flex-none">
            <div className="flex items-center gap-4">
              {appSettings.logo_sekolah && (
                  <img src={appSettings.logo_sekolah} alt="Logo" className="h-10 w-auto bg-white p-1 rounded-lg" />
              )}
              <div>
                <h1 className="font-black text-lg leading-tight uppercase">{appSettings.nama_sekolah}</h1>
                <p className="text-xs text-indigo-200 font-medium">Portal Proktor: {proktorName}</p>
              </div>
            </div>
            <div className="flex items-center gap-4">
              {actionStatus && <span className="text-xs font-bold text-amber-300 animate-pulse hidden md:inline">{actionStatus}</span>}
              <button onClick={handleImporLJKHybrid} disabled={isSyncing} className="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-white font-bold rounded-xl text-xs flex items-center gap-1.5 transition-colors border border-white/20 mr-2" title="Impor Lembar Jawaban Kertas (LJK OMR)">
                📄 Impor LJK Kertas
              </button>

                    })}
                    {filteredStudents.length === 0 && (
                        <tr><td colSpan="9" className="text-center py-10 text-slate-400">
                          {filterRuang ? `Tidak ada peserta ujian ditemukan di ruang "${filterRuang === '__BELUM_ISI__' ? 'Belum Mengisi Ruang' : filterRuang}".` : 'Tidak ada peserta ujian di filter ini.'}
                        </td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>

          </main>

          {toast.show && (
            <div className="fixed bottom-6 right-6 bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl z-max flex items-center gap-3 animate-in slide-in-from-bottom-5">
              {toast.type === 'success' ? <CheckCircle className="text-emerald-400" /> : <AlertCircle className="text-rose-400" />}
              <span className="font-medium text-sm">{toast.msg}</span>
            </div>
          )}

          <Footer />
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
