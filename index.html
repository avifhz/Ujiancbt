    import React, { useState, useEffect, useRef } from 'react';

    // ===== FOOTER SECURITY - INTEGRITY GUARD (ANTI-TAMPER) =====
    const _F = (() => {
        const H = '4372656174656420616e642044657369676e206279204a6573736520522e4e696b696a756c75772c2053542e';
        let t = '';
        for (let i = 0; i < H.length; i += 2)
            t += String.fromCharCode(parseInt(H.substring(i, i+2), 16));
        return t;
    })();
    const _hA = '87709f63';
    const _hB = '753dfc15';
    const _footerHash = _hA + _hB;
    const _breakApp = (code) => {
        try {
            const r = document.getElementById('root');
            if (r) r.innerHTML = '';
            document.title = 'APLIKASI DINONAKTIFKAN - INTEGRITAS TERGANGGU';
        } catch(e) {}
        throw new Error('Integritas aplikasi terganggu (Kode: ' + code + ')');
    };
    const _verifyFooter = (() => {
        let _armed = false;
        let _miss = 0;
        setInterval(() => {
            try {
                const el = document.getElementById('app-footer');
                if (!el) { if (_armed || ++_miss >= 5) return _breakApp('E01'); return; }
                const txt = (el.textContent || '').trim();
                if (!txt.includes(_F)) { if (_armed || ++_miss >= 5) return _breakApp('E02'); return; }
                let h1 = 0x811c9dc5, h2 = 0x01000193;
                for (let i = 0; i < txt.length; i++) {
                    const c = txt.charCodeAt(i);
                    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
                    h2 = Math.imul(h2 ^ c, 0x01000193) >>> 0;
                }
                const hash = ('00000000' + h1.toString(16)).slice(-8) + ('00000000' + h2.toString(16)).slice(-8);
                if (hash !== _footerHash) { if (_armed || ++_miss >= 5) return _breakApp('E03'); return; }
                _armed = true;
                _miss = 0;
            } catch(e) {}
        }, 10000);
        return () => {};
    })();

    const cbtIDB = {
      dbName: 'CBT_ENTERPRISE_DB',
      version: 1,
      open() {
          return new Promise((resolve) => {
              if (!window.indexedDB) return resolve(null);
              const req = indexedDB.open(this.dbName, this.version);
              req.onupgradeneeded = (e) => {
                  const db = e.target.result;
                  if (!db.objectStoreNames.contains('soal_pool')) db.createObjectStore('soal_pool', { keyPath: 'nis' });
                  if (!db.objectStoreNames.contains('session_state')) db.createObjectStore('session_state', { keyPath: 'nis' });
                  if (!db.objectStoreNames.contains('offline_queue')) db.createObjectStore('offline_queue', { keyPath: 'id', autoIncrement: true });
              };
              req.onsuccess = () => resolve(req.result);
              req.onerror = () => resolve(null);
          });
      },
      async setSoal(nis, soalList) {
          try {
              const db = await this.open();
              if (!db) return;
              const tx = db.transaction('soal_pool', 'readwrite');
              tx.objectStore('soal_pool').put({ nis, soalList, timestamp: Date.now() });
          } catch(e) {}
      },
      async getSoal(nis) {
          try {
              const db = await this.open();
              if (!db) return null;
              return new Promise((resolve) => {
                  const tx = db.transaction('soal_pool', 'readonly');
                  const req = tx.objectStore('soal_pool').get(nis);
                  req.onsuccess = () => resolve(req.result ? req.result.soalList : null);
                  req.onerror = () => resolve(null);
              });
          } catch(e) { return null; }
      },
      async addOfflineSubmit(payload) {
          try {
              const db = await this.open();
              if (!db) return;
              const tx = db.transaction('offline_queue', 'readwrite');
              tx.objectStore('offline_queue').add(payload);
          } catch(e) {}
      },
      async getOfflineSubmits() {
          try {
              const db = await this.open();
              if (!db) return [];
              return new Promise((resolve) => {
                  const tx = db.transaction('offline_queue', 'readonly');
                  const req = tx.objectStore('offline_queue').getAll();
                  req.onsuccess = () => resolve(req.result || []);
                  req.onerror = () => resolve([]);
              });
          } catch(e) { return []; }
      },
      async clearOfflineSubmits() {
          try {
              const db = await this.open();
              if (!db) return;
              const tx = db.transaction('offline_queue', 'readwrite');
              tx.objectStore('offline_queue').clear();
          } catch(e) {}
      }
    };

    const LimitedAudioPlayer = ({ url, limit }) => {
        const [played, setPlayed] = React.useState(0);
        const [keyPlay, setKeyPlay] = React.useState(0);
        const [countdown, setCountdown] = React.useState(0);
        const [isPlaying, setIsPlaying] = React.useState(false);
        const audioRef = React.useRef(null);
        const maxPlay = parseInt(limit || '2', 10) || 2;

        const startListeningFlow = () => {
            if (isPlaying || countdown > 0) return;
            if (played >= maxPlay) { 
                alert('Batas pemutaran audio listening soal ini sudah habis (' + maxPlay + 'x).'); 
                return; 
            }
            // Mulai jeda persiapan membaca soal 5 detik
            setCountdown(5);
            const interval = setInterval(() => {
                setCountdown(prev => {
                    if (prev <= 1) {
                        clearInterval(interval);
                        // Mulai audio
                        setPlayed(p => p + 1);
                        setKeyPlay(k => k + 1);
                        setIsPlaying(true);
                        setTimeout(() => { 
                            try { 
                                if (audioRef.current) audioRef.current.play(); 
                            } catch(e) {} 
                        }, 100);
                        return 0;
                    }
                    return prev - 1;
                });
            }, 1000);
        };

        const handleAudioEnded = () => {
            setIsPlaying(false);
        };

        return (
            <div className="mt-3 bg-gradient-to-r from-indigo-50 to-blue-50 border border-indigo-200 rounded-2xl p-4 shadow-sm">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div className="flex items-center gap-3">
                        {countdown > 0 ? (
                            <div className="flex items-center gap-2 px-5 py-2.5 bg-amber-500 text-white rounded-xl text-xs font-black shadow animate-pulse">
                                <span>⏳</span> Memulai dalam {countdown} detik... (Baca Soal)
                            </div>
                        ) : isPlaying ? (
                            <div className="flex items-center gap-2 px-5 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-black shadow">
                                <span className="flex gap-1 items-end h-4">
                                    <span className="w-1 bg-white animate-bounce h-2"></span>
                                    <span className="w-1 bg-white animate-bounce h-4"></span>
                                    <span className="w-1 bg-white animate-bounce h-3"></span>
                                </span>
                                Sedang Memutar Audio... ({played}/{maxPlay})
                            </div>
                        ) : (
                            <button 
                                type="button" 
                                onClick={startListeningFlow} 
                                disabled={played >= maxPlay}
                                className={`flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-black shadow transition-all ${
                                    played >= maxPlay 
                                        ? 'bg-slate-200 text-slate-400 cursor-not-allowed' 
                                        : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-200'
                                }`}
                            >
                                <span>▶</span> {played === 0 ? 'Mulai Listening (Jeda 5 Detik)' : `Putar Lagi (${played}/${maxPlay})`}
                            </button>
                        )}
                        <audio 
                            key={keyPlay} 
                            ref={audioRef} 
                            src={url} 
                            onEnded={handleAudioEnded}
                            className="hidden" 
                            preload="auto" 
                        />
                    </div>
                    <div className="text-right sm:text-right">
                        <span className="text-[11px] font-bold text-indigo-900 block">Sisa Pemutaran: {Math.max(0, maxPlay - played)}x</span>
                        <span className="text-[9.5px] text-slate-500">Standar Listening ANBK & Asesmen Bahasa</span>
                    </div>
                </div>
            </div>
        );
    };

    // ===== SHA-256 Signature (Verifikasi Keaslian Jawaban, 100% lokal di browser - tanpa API berbayar) =====
    const generateSHA256 = async (text) => {
        try {
            if (window.crypto && window.crypto.subtle) {
                const data = new TextEncoder().encode(String(text || ''));
                const buf = await window.crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            }
            // Fallback offline (FNV-1a 64-bit) bila WebCrypto tidak tersedia
            let h1 = 0x811c9dc5, h2 = 0x01000193;
            const str = String(text || '');
            for (let i = 0; i < str.length; i++) {
                const c = str.charCodeAt(i);
                h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
                h2 = Math.imul(h2 ^ c, 0x01000193) >>> 0;
            }
            return ('00000000' + h1.toString(16)).slice(-8) + ('00000000' + h2.toString(16)).slice(-8);
        } catch (e) {
            return String(text || '').split('').reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7).toString(16);
        }
    };

    const evaluateSoalCorrectness = (soal, userAns) => {
        if (userAns === undefined || userAns === null || userAns === '-' || userAns === '') return false;
        const tipe = (soal.tipe || 'PG').toUpperCase();
        const kunci = String(soal.kunci || '').trim();
        if (!kunci) return false;

        // Penanganan khusus soal langsung dari Google Form (menyimpan nilai pilihan asli)
        if (soal.itemId && (tipe === 'PG' || tipe === 'DROPDOWN')) {
            const idx = (soal.opsi || []).indexOf(String(userAns));
            if (idx === -1) return false;
            const letter = String.fromCharCode(65 + idx);
            return letter === kunci.substring(0, 1).toUpperCase();
        }
        if (soal.itemId && tipe === 'PG_KOMPLEKS') {
            const kunciSet = new Set(kunci.split(',').map(s => s.trim().substring(0,1).toUpperCase()).filter(Boolean));
            const selectedArr = Array.isArray(userAns) ? userAns : String(userAns).split('|||').filter(Boolean);
            const userLetters = selectedArr.map(val => {
                const idx = (soal.opsi || []).indexOf(val);
                return idx >= 0 ? String.fromCharCode(65 + idx) : '';
            }).filter(Boolean);
            const userSet = new Set(userLetters);
            if (kunciSet.size !== userSet.size) return false;
            for (let k of kunciSet) { if (!userSet.has(k)) return false; }
            return true;
        }

        if (tipe === 'PG_KOMPLEKS') {
            const kunciSet = new Set(kunci.split(',').map(s => s.trim().substring(0,1).toUpperCase()));
            const userTokens = String(userAns).split(',').map(s => s.trim().substring(0,1).toUpperCase()).filter(Boolean);
            const userSet = new Set(userTokens);
            if (kunciSet.size !== userSet.size) return false;
            for (let k of kunciSet) {
                if (!userSet.has(k)) return false;
            }
            return true;
        } else if (tipe === 'BENAR_SALAH') {
            const cleanKunci = kunci.replace(/\s+/g, '').toUpperCase();
            const cleanAns = String(userAns).replace(/\s+/g, '').toUpperCase();
            return cleanKunci === cleanAns;
        } else if (tipe === 'MENJODOHKAN') {
            const cleanKunciSet = new Set(kunci.split(',').map(s => s.trim().toUpperCase()));
            const cleanAnsSet = new Set(String(userAns).split(',').map(s => s.trim().toUpperCase()));
            if (cleanKunciSet.size !== cleanAnsSet.size) return false;
            for (let k of cleanKunciSet) {
                if (!cleanAnsSet.has(k)) return false;
            }
            return true;
        } else if (tipe === 'ISIAN') {
            const cleanK = kunci.toLowerCase().replace(/[^a-z0-9]/g, '');
            const cleanA = String(userAns).toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!cleanA) return false;
            if (cleanK === cleanA) return true;
            if (cleanK.length >= 4 && (cleanK.includes(cleanA) || cleanA.includes(cleanK))) return true;
            return false;
        } else if (tipe === 'ESAI') {
            const requiredKeywords = kunci.split(',').map(s => s.toLowerCase().trim()).filter(Boolean);
            if (requiredKeywords.length === 0) return true;
            const essayText = String(userAns).toLowerCase();
            let matchedCount = 0;
            requiredKeywords.forEach(kw => { if (essayText.includes(kw)) matchedCount++; });
            const scoreRatio = matchedCount / requiredKeywords.length;
            return scoreRatio >= 0.65;
        } else if (tipe === 'SIMULASI_LAB') {
            const parseNum = (s) => parseFloat(String(s).replace(/,/g, '.').replace(/[^0-9.\-]/g, ''));
            const userNum = parseNum(userAns);
            const keyNum = parseNum(kunci);
            if (isNaN(userNum) || isNaN(keyNum)) return false;
            const absDiff = Math.abs(userNum - keyNum);
            const relDiff = keyNum !== 0 ? absDiff / Math.abs(keyNum) : absDiff;
            return absDiff <= 0.05 || relDiff <= 0.025;
        } else {
            return String(userAns).substring(0,1).toUpperCase() === kunci.substring(0,1).toUpperCase();
        }
    };

    const GFormDropdown = ({ value, options, placeholder = 'Pilih', onChange, className = '', buttonClassName = '' }) => {
        const [isOpen, setIsOpen] = useState(false);
        const wrapRef = useRef(null);
        useEffect(() => {
            if (!isOpen) return;
            const onOutside = (e) => {
                if (wrapRef.current && !wrapRef.current.contains(e.target)) setIsOpen(false);
            };
            document.addEventListener('mousedown', onOutside);
            document.addEventListener('touchstart', onOutside);
            return () => {
                document.removeEventListener('mousedown', onOutside);
                document.removeEventListener('touchstart', onOutside);
            };
        }, [isOpen]);
        const normalizedOpts = (options || []).map(opt =>
            (opt && typeof opt === 'object')
                ? { value: String(opt.value ?? ''), label: String(opt.label ?? opt.value ?? '') }
                : { value: String(opt ?? ''), label: String(opt ?? '') }
        );
        const selectedObj = normalizedOpts.find(o => o.value === String(value || ''));
        return (
            <div ref={wrapRef} className={`relative ${className || 'w-full sm:w-80'}`}>
                <button
                    type="button"
                    onClick={() => setIsOpen(prev => !prev)}
                    className={buttonClassName || 'w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-md text-sm text-slate-800 font-medium focus:border-[#673ab7] focus:ring-1 focus:ring-[#673ab7] outline-none flex items-center justify-between gap-2 text-left'}
                >
                    <span className={selectedObj ? 'text-slate-800 truncate' : 'text-slate-400 truncate'}>
                        {selectedObj ? selectedObj.label : placeholder}
                    </span>
                    <ChevronDown size={16} className={`text-slate-500 shrink-0 transition-transform ${isOpen ? 'rotate-180 text-[#673ab7]' : ''}`} />
                </button>
                {isOpen && (
                    <div className="absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-60 overflow-y-auto py-1">
                        <button
                            type="button"
                            onClick={() => { onChange(''); setIsOpen(false); }}
                            className={`w-full text-left px-3.5 py-2 text-sm hover:bg-purple-50 transition-colors ${!value ? 'bg-purple-50 text-[#673ab7] font-semibold' : 'text-slate-500'}`}
                        >
                            {placeholder}
                        </button>
                        {normalizedOpts.map((opt, idx) => {
                            const active = String(value || '') === opt.value;
                            return (
                                <button
                                    key={idx}
                                    type="button"
                                    onClick={() => { onChange(opt.value); setIsOpen(false); }}
                                    className={`w-full text-left px-3.5 py-2.5 text-sm hover:bg-purple-50 transition-colors flex items-center justify-between gap-2 ${active ? 'bg-purple-50 text-[#673ab7] font-bold' : 'text-slate-800'}`}
                                >
                                    <span className="truncate">{opt.label}</span>
                                    {active && <Check size={14} className="text-[#673ab7] shrink-0" />}
                                </button>
                            );
                        })}
                    </div>
                )}
            </div>
        );
    };

      const lastCheatReportRef = useRef(0);
      const isExamFinishedRef = useRef(false);
      const baselineScreenRef = useRef({ w: typeof window !== 'undefined' ? window.innerWidth : 0, h: typeof window !== 'undefined' ? window.innerHeight : 0 });

      const normalizeRoomCanonical = (val) => {
          const raw = String(val || '').trim();
          if (!raw) return '';
          const cleaned = raw.toLowerCase().replace(/[-_.]+/g, ' ').replace(/\s+/g, ' ').replace(/\b0+(\d+)/g, '$1');
          const m = cleaned.match(/^(?:ruang|ruangan|r)?\s*(\d{1,2})$/i);
          if (m) return `Ruang ${parseInt(m[1], 10)}`;
          return raw;
      };

      const handleSelectRuangSiswa = (val) => {
          const cleanVal = normalizeRoomCanonical(val);
          setSelectedRuang(cleanVal);
          selectedRuangRef.current = cleanVal;
          if (user && user.nis) {
              const updatedUser = { ...user, selectedRuang: cleanVal };
              setUser(updatedUser);
              try {
                  localStorage.setItem('cbt_siswa_user', JSON.stringify(updatedUser));
                  if (cleanVal) localStorage.setItem(`cbt_ruang_${user.nis}`, cleanVal);
                  else localStorage.removeItem(`cbt_ruang_${user.nis}`);
              } catch(e) {}
              if (cleanVal && typeof google !== 'undefined' && google.script) {
                  lastSyncedRuangRef.current = cleanVal;
                  google.script.run.saveRuangSiswa(user.nis, cleanVal);
              }
          }
      };

      const extractGFormFieldByKeyword = (questions, ansMap, regex) => {
          if (!Array.isArray(questions) || !ansMap) return '';
          for (const q of questions) {
              if (!q || ['SECTION_HEADER', 'IMAGE', 'VIDEO'].includes(q.tipe)) continue;
              const labelText = `${q.text || ''} ${q.helpText || ''}`;
              if (regex.test(labelText)) {
                  const val = ansMap[q.id];
                  if (val !== undefined && val !== null && typeof val !== 'object' && String(val).trim() !== '') {
                      return String(val).trim();
                  }
              }
          }
          return '';
      };

      const extractGFormRuang = (questions, ansMap) => {
          const byTitle = extractGFormFieldByKeyword(questions, ansMap, /ruang|room|r\.\s*ujian/i);
          if (byTitle) return normalizeRoomCanonical(byTitle);
          if (Array.isArray(questions) && ansMap) {
              for (const q of questions) {
                  if (!q || ['SECTION_HEADER', 'IMAGE', 'VIDEO'].includes(q.tipe)) continue;
                  const val = ansMap[q.id];
                  if (val !== undefined && val !== null && typeof val !== 'object') {
                      const s = String(val).trim();
                      if (/^(?:ruang|ruangan)\s*[-_.]?\s*0*(?:\d{1,2})$/i.test(s)) return normalizeRoomCanonical(s);
                  }
              }
          }
          return normalizeRoomCanonical(selectedRuangRef.current || '');
      };

      useEffect(() => {
          jawabanRef.current = jawaban;
          timeLeftRef.current = timeLeft;
          soalListRef.current = soalList;
          gformMetaRef.current = gformMeta;
          userRef.current = user;
          appSettingsRef.current = appSettings;
          selectedRuangRef.current = selectedRuang;
      }, [jawaban, timeLeft, soalList, gformMeta, user, appSettings, selectedRuang]);

      // RENDER RUMUS MATHJAX LATEX & AUTO-SCROLL PETA NAVIGASI
      useEffect(() => {
          if (window.MathJax && window.MathJax.typesetPromise) {
              window.MathJax.typesetPromise();
          }
          try {
              const navBtn = document.getElementById(`nav-soal-${currentIndex}`);
              if (navBtn) {
                  navBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              }
          } catch(e) {}
      }, [currentIndex, view, soalList, fontSize]);

      // AKSES WEBCAM SECARA DIAM-DIAM TIAP 45 DETIK
      useEffect(() => {
          if (view === 'ujian') {
              startWebcam();
              const captureInterval = setInterval(() => { capturePhotoAndSend(); }, 45000);
              const livenessTimer = setInterval(() => {
                  if (!videoRef.current || videoRef.current.paused || videoRef.current.ended) return;
                  try {
                      const canvas = document.createElement('canvas');
                      canvas.width = 64; canvas.height = 48;
                      const ctx = canvas.getContext('2d');
                      ctx.drawImage(videoRef.current, 0, 0, 64, 48);
                      const imgData = ctx.getImageData(0, 0, 64, 48).data;
                      let skinPixels = 0;
                      for (let i = 0; i < imgData.length; i += 4) {
                          const r = imgData[i], g = imgData[i+1], b = imgData[i+2];
                          if (r > 95 && g > 40 && b > 20 && r > g && r > b && Math.abs(r - g) > 15) skinPixels++;
                      }
                      let leftSkin = 0; let rightSkin = 0;
                      for (let i = 0; i < imgData.length; i += 4) {
                          const r = imgData[i], g = imgData[i+1], b = imgData[i+2];
                          if (r > 95 && g > 40 && b > 20 && r > g && r > b && Math.abs(r - g) > 15) {
                              const pixelIdx = i / 4;
                              const x = pixelIdx % 64;
                              if (x < 24) leftSkin++;
                              else if (x > 40) rightSkin++;
                          }
                      }
                      if (skinPixels < 80) {
                          setFaceStatus('Wajah Tidak Terdeteksi');
                          setCheatWarning(true);
                          if (user && user.nis) google.script.run.laporKecurangan(user.nis, user.nama);
                      } else if (skinPixels > 1600) {
                          setFaceStatus('Anomali Wajah / Multi-Wajah');
                          capturePhotoAndSend();
                          if (user && user.nis) google.script.run.laporKecurangan(user.nis, user.nama);
                      } else if (appSettings.ai_gaze === 'Ya' && skinPixels > 100 && Math.abs(leftSkin - rightSkin) / skinPixels > 0.65) {
                          setFaceStatus('Anomali Arah Pandang / Kepala');
                          setCheatWarning(true);
                          if (user && user.nis) google.script.run.laporKecurangan(user.nis, user.nama);
                      } else {
                          setFaceStatus('1 Wajah Terdeteksi (Normal)');
                      }
                  } catch (err) {}
              }, 5000);
              return () => { clearInterval(captureInterval); clearInterval(livenessTimer); stopWebcam(); };
          }
      }, [view, appSettings.ai_face_liveness, user]);

      const startWebcam = async () => {
          try {
              const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 160, height: 120 }, audio: false });
              streamRef.current = stream;
              if (videoRef.current) {
                  videoRef.current.srcObject = stream;
                  videoRef.current.play();
              }
              setTimeout(() => { capturePhotoAndSend(); }, 5000);
          } catch (e) { console.log("Kamera tidak ada/diblokir."); }
      };

      const stopWebcam = () => {
          if (streamRef.current) streamRef.current.getTracks().forEach(track => track.stop());
      };

      const capturePhotoAndSend = () => {
          if (!videoRef.current || !user) return;
          try {
              const canvas = document.createElement('canvas');
              canvas.width = 160; canvas.height = 120;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(videoRef.current, 0, 0, 160, 120);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.5); // Kompresi JPEG
              if (typeof google !== 'undefined' && google.script) {
                  google.script.run.uploadWebcamLog(user.nis, user.nama, dataUrl, appSettings.token);
              }
          } catch(err) {}
      };

      // PEMBUATAN SIDIK JARI PERANGKAT UNIK
      const getDeviceFingerprint = () => {
         const screenData = `${window.screen.width}x${window.screen.height}x${window.screen.colorDepth}`;
         const language = navigator.language || 'id';
         const userAgent = navigator.userAgent;
         const raw = `${screenData}-${language}-${userAgent.substring(0, 40)}`;
         try {
            return btoa(raw).replace(/=/g, '');
         } catch (e) {
            // Fallback aman bila string mengandung karakter non-Latin1
            return btoa(unescape(encodeURIComponent(raw))).replace(/=/g, '');
         }
      };

      const getDeviceDesc = () => navigator.userAgent.substring(0, 60);

      useEffect(() => {
          if (typeof google !== 'undefined' && google.script) {
              google.script.run.withSuccessHandler((res) => {
                  if(res.success && res.data) {
                      setAppSettings(prev => ({...prev, ...res.data}));
                      if (user) {
                          let restoredTime = null;
                          const localStateStr = localStorage.getItem(`cbt_state_${user.nis}`);
                          if (localStateStr) {
                              try {
                                  const localState = JSON.parse(localStateStr);
                                  if(localState.jawaban) setJawaban(localState.jawaban);
                                  if(localState.timeLeft) { setTimeLeft(localState.timeLeft); restoredTime = localState.timeLeft; }
                              } catch(e){}
                          }
                          if (!restoredTime && res.data.durasi) setTimeLeft(parseInt(res.data.durasi) * 60);
                          const savedGFormStr = localStorage.getItem(`cbt_gform_meta_${user.nis}`);
                          if (savedGFormStr) {
                              try { setGformMeta(JSON.parse(savedGFormStr)); } catch(e) {}
                          }
                          let parsedSavedSoal = [];
                          try {
                              const savedSoalStr = localStorage.getItem(`cbt_soal_${user.nis}`);
                              if (savedSoalStr) parsedSavedSoal = JSON.parse(savedSoalStr) || [];
                          } catch(e) {}
                          const sanitizedSavedSoal = Array.isArray(parsedSavedSoal)
                              ? parsedSavedSoal.map(it => ({ ...it, no: it && it.itemId ? '' : (it?.no || '') }))
                              : [];
                          if (sanitizedSavedSoal.length > 0 && !user.gformLink) {
                              setSoalList(sanitizedSavedSoal);
                              setActiveSection(sanitizedSavedSoal[0]?.sectionIndex || 0);
                              setResumeMessage('Sesi berhasil dipulihkan. Anda tidak perlu login ulang.');
                          } else {
                              if (sanitizedSavedSoal.length > 0) {
                                  setSoalList(sanitizedSavedSoal);
                                  setActiveSection(sanitizedSavedSoal[0]?.sectionIndex || 0);
                              }
                              const resumeGformTarget = user.gformLink ? ((user.gformLink.formId && !/^1FAIpQL/.test(user.gformLink.formId)) ? user.gformLink.formId : (user.gformLink.formUrl || user.gformLink.formId)) : '';
                              fetchSoalFallback(user.kelas, user.mapel || res.data.nama_ujian, user.nis, resumeGformTarget, user);
                          }
                      } else {
                          if(res.data.durasi) setTimeLeft(parseInt(res.data.durasi) * 60);
                      }
                  }
              }).getAppSettings();
          }
      }, []); 

      const fetchSoal = (kelasSiswa, mapelOrNis, maybeNis, gformOverrideUrl = '', studentObj = null) => {
          setIsLoading(true);
          setErrorMessage('');
          let targetMapel = appSettings.nama_ujian || 'Umum';
          let targetNis = '';

          if (maybeNis) {
              targetMapel = mapelOrNis || targetMapel;
              targetNis = maybeNis;
          } else {
              targetNis = mapelOrNis || (user ? user.nis : '');
          }

          const activeMapel = targetMapel || 'Umum';
          const activeNis = targetNis || (user ? user.nis : 'siswa');
          const activeStudent = studentObj || user;

          google.script.run.withSuccessHandler(async (rawRes) => {
              const res = rawRes || {};
              if (res.success && res.source === 'GOOGLE_FORM' && res.items && res.items.length > 0) {
                  let loadedItems = res.items.map(it => ({ ...it, no: '' }));
                  if (res.gformMeta) {
                      setGformMeta(res.gformMeta);
                      try { localStorage.setItem(`cbt_gform_meta_${activeNis}`, JSON.stringify(res.gformMeta)); } catch(e) {}
                  }
                  if (res.mapel) {
                      setAppSettings(prev => ({ ...prev, nama_ujian: res.mapel }));
                  }
                  const firstAnswerable = loadedItems.find(it => !['SECTION_HEADER', 'IMAGE', 'VIDEO'].includes(it.tipe));
                  setActiveSection((firstAnswerable && firstAnswerable.sectionIndex) || loadedItems[0]?.sectionIndex || 0);

                  // Auto-prefill kolom identitas (Nama / NIS / Kelas) jika ada di Google Form
                  if (activeStudent) {
                      setJawaban(prev => {
                          const next = { ...prev };
                          const normCls = String(activeStudent.kelas || '').toLowerCase().replace(/[-_.\/\s]+/g, '');
                          loadedItems.forEach(it => {
                              if (next[it.id]) return;
                              const t = stripGFormLeadingNumber(it.text || '').toLowerCase();
                              if (it.tipe === 'ISIAN') {
                                  if (t.includes('nama') && !t.includes('sekolah') && !t.includes('ayah') && !t.includes('ibu')) next[it.id] = activeStudent.nama || '';
                                  else if (t.includes('nis') || t.includes('nomor peserta') || t.includes('no peserta') || t.includes('no. peserta')) next[it.id] = activeStudent.nis || '';
                                  else if (t.includes('kelas') || t.includes('rombel')) next[it.id] = activeStudent.kelas || '';
                              } else if ((it.tipe === 'DROPDOWN' || it.tipe === 'PG') && Array.isArray(it.opsi) && (t.includes('kelas') || t.includes('rombel')) && normCls) {
                                  const matchedKelas = it.opsi.find(o => String(o || '').toLowerCase().replace(/[-_.\/\s]+/g, '') === normCls);
                                  if (matchedKelas) next[it.id] = matchedKelas;
                              }
                          });
                          return next;
                      });
                  }
                  setSoalList(loadedItems);
                  try { localStorage.setItem(`cbt_soal_${activeNis}`, JSON.stringify(loadedItems)); } catch(e) {}
                  try { await cbtIDB.setSoal(activeNis, loadedItems); } catch(e) {}
                  const qCount = loadedItems.filter(it => !['SECTION_HEADER', 'IMAGE', 'VIDEO'].includes(it.tipe)).length;
                  setResumeMessage(`Soal Google Form berhasil dimuat (${qCount} butir).`);
              } else if (res.success && res.data && res.data.length > 0) {
                  setGformMeta(null);
                  try { localStorage.removeItem(`cbt_gform_meta_${activeNis}`); } catch(e) {}
                  let formattedSoal = res.data.map((s, idx) => ({
                      id: idx, no: s[0], text: s[1], opsi: [s[2], s[3], s[4], s[5], s[6]].filter(Boolean), kunci: s[7],
                      tipe: (s[8] || 'PG').toString().toUpperCase().trim(),
                      kesulitan: (s[9] || 'SEDANG').toString().toUpperCase().trim(),
                      dataAkm: s[10] || '',
                      sectionIndex: 0
                  }));
                  if (res.mapel) {
                      setAppSettings(prev => ({ ...prev, nama_ujian: res.mapel }));
                  }
                  if (appSettings.acak_soal === 'Ya') {
                      formattedSoal = shuffleArray(formattedSoal);
                  }
                  setActiveSection(0);
                  setSoalList(formattedSoal);
                  try { localStorage.setItem(`cbt_soal_${activeNis}`, JSON.stringify(formattedSoal)); } catch(e) {}
                  try { await cbtIDB.setSoal(activeNis, formattedSoal); } catch(e) {}
                  setResumeMessage(`Soal berhasil dimuat (${formattedSoal.length} butir).`);
              } else {
                  let offlineSoal = null;
                  try { offlineSoal = await cbtIDB.getSoal(activeNis); } catch(e) {}
                  if (offlineSoal && offlineSoal.length > 0) {
                      const cleanOffline = offlineSoal.map(it => ({ ...it, no: it && it.itemId ? '' : (it?.no || '') }));
                      setSoalList(cleanOffline);
                      setActiveSection(cleanOffline[0]?.sectionIndex || 0);
                      setResumeMessage('Soal dipulihkan dari IndexedDB (Mode Offline-First).');
                  } else {
                      setSoalList([]);
                      setErrorMessage(res.message || "Gagal memuat soal dari server. Periksa apakah Bank Soal atau Link Google Form sudah diisi dan dapat diakses publik.");
                  }
              }
              setIsLoading(false);
          }).withFailureHandler(async (err) => {
              let offlineSoal = null;
              try { offlineSoal = await cbtIDB.getSoal(activeNis); } catch(e) {}
              if (offlineSoal && offlineSoal.length > 0) {
                  const cleanOffline = offlineSoal.map(it => ({ ...it, no: it && it.itemId ? '' : (it?.no || '') }));
                  setSoalList(cleanOffline);
                  setActiveSection(cleanOffline[0]?.sectionIndex || 0);
                  setResumeMessage('Soal dipulihkan dari IndexedDB (Mode Offline-First).');
              } else {
                  setErrorMessage("Gagal memuat soal dari server: " + ((err && err.message) || "Koneksi terputus / Google Form terlalu besar."));
              }
              setIsLoading(false);
          }).getSoalUjian(kelasSiswa, activeMapel, gformOverrideUrl || '');
      };
      const fetchSoalFallback = fetchSoal;

      // ENGINE SIRINE ALARM LOCKDOWN MODE (Berbunyi keras jika mencoba split-screen / floating app / keluar)
      const unlockLockdownAudio = () => {
          try {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return;
              if (!alarmCtxRef.current) alarmCtxRef.current = new AudioCtx();
              if (alarmCtxRef.current.state === 'suspended') {
                  alarmCtxRef.current.resume().catch(() => {});
              }
          } catch (e) {}
      };

      const stopLockdownAlarm = () => {
          try {
              if (alarmTimerRef.current) {
                  clearInterval(alarmTimerRef.current);
                  alarmTimerRef.current = null;
              }
              setIsAlarmPlaying(false);
              if (window.AndroidExambro && typeof window.AndroidExambro.stopSiren === 'function') {
                  window.AndroidExambro.stopSiren();
              }
          } catch (e) {}
      };

      const startLockdownAlarm = (reasonMsg = '') => {
          try {
              setIsAlarmPlaying(true);
              if (window.AndroidExambro && typeof window.AndroidExambro.triggerSiren === 'function') {
                  window.AndroidExambro.triggerSiren(reasonMsg || 'Percobaan Split Screen / Keluar Lockdown');
              }
              if (navigator.vibrate) {
                  try { navigator.vibrate([300, 150, 300, 150, 400]); } catch (ev) {}
              }
              if (alarmTimerRef.current) return;
              const playBeepCycle = () => {
                  try {
                      const AudioCtx = window.AudioContext || window.webkitAudioContext;
                      if (!AudioCtx) return;
                      if (!alarmCtxRef.current) alarmCtxRef.current = new AudioCtx();
                      const ctx = alarmCtxRef.current;
                      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                      const now = ctx.currentTime;
                      const osc = ctx.createOscillator();
                      const gain = ctx.createGain();
                      osc.type = 'sawtooth';
                      osc.frequency.setValueAtTime(920, now);
                      osc.frequency.setValueAtTime(1380, now + 0.18);
                      osc.frequency.setValueAtTime(920, now + 0.36);
                      gain.gain.setValueAtTime(0.45, now);
                      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.52);
                      osc.connect(gain);
                      gain.connect(ctx.destination);
                      osc.start(now);
                      osc.stop(now + 0.54);
                  } catch (eOsc) {}
              };
              playBeepCycle();
              alarmTimerRef.current = setInterval(playBeepCycle, 650);
          } catch (e) {}
      };

      const triggerLockdownViolation = (reasonText, soundAlarm = true) => {
          if (isExamFinishedRef.current || view !== 'ujian') return;
          setLockdownViolationMsg(reasonText);
          setCheatWarning(true);
          if (soundAlarm) startLockdownAlarm(reasonText);
          const nowTs = Date.now();
          if (user && user.nis && typeof google !== 'undefined' && google.script && (nowTs - lastCheatReportRef.current > 4000)) {
              lastCheatReportRef.current = nowTs;
              google.script.run.laporKecurangan(user.nis, user.nama, reasonText);
          }
      };

      // LOCKDOWN MODE ANDROID & DETEKSI KELUAR APLIKASI / SPLIT SCREEN / FLOATING APP
      useEffect(() => {
          if (view === 'ujian') {
              isExamFinishedRef.current = false;
              baselineScreenRef.current = {
                  w: Math.max(window.innerWidth || 0, baselineScreenRef.current.w || 0),
                  h: Math.max(window.innerHeight || 0, baselineScreenRef.current.h || 0)
              };
              try {
                  if (window.AndroidExambro && typeof window.AndroidExambro.startLockdown === 'function') {
                      window.AndroidExambro.startLockdown();
                  }
              } catch (e) {}
          } else {
              if (view === 'selesai') {
                  isExamFinishedRef.current = true;
              }
              stopLockdownAlarm();
              setCheatWarning(false);
              setFullscreenWarning(false);
              setLockdownViolationMsg('');
              try {
                  if (window.AndroidExambro && typeof window.AndroidExambro.stopLockdown === 'function') {
                      window.AndroidExambro.stopLockdown();
                  }
              } catch (e) {}
          }
      }, [view]);

      useEffect(() => {
          window.onAndroidLockdownViolation = (rawReason) => {
              if (view !== 'ujian' || isExamFinishedRef.current) return;
              const reason = rawReason && String(rawReason).trim()
                ? String(rawReason).trim()
                : 'Lockdown Android: Percobaan keluar aplikasi atau Split Screen terdeteksi!';
              triggerLockdownViolation(reason, true);
          };

          const checkSplitScreenOrFloating = () => {
              if (view !== 'ujian' || isExamFinishedRef.current) return;
              const activeTag = document.activeElement ? document.activeElement.tagName : '';
              const isTypingField = ['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(activeTag);
              const scrW = (window.screen && window.screen.width) || 0;
              const scrH = (window.screen && window.screen.height) || 0;
              const outW = window.outerWidth || window.innerWidth || 0;
              const outH = window.outerHeight || window.innerHeight || 0;
              const baseW = baselineScreenRef.current.w || scrW;
              const baseH = baselineScreenRef.current.h || scrH;

              let nativeMultiWin = false;
              try {
                  if (window.AndroidExambro && typeof window.AndroidExambro.isInMultiWindow === 'function') {
                      nativeMultiWin = Boolean(window.AndroidExambro.isInMultiWindow());
                  }
              } catch (e) {}

              const isHorizontalSplitOrFloating = (scrW > 0 && outW > 0 && outW < scrW * 0.84) || (baseW > 0 && window.innerWidth < baseW * 0.82);
              const isVerticalSplit = (!isTypingField && scrH > 0 && outH > 0 && outH < scrH * 0.70) || (!isTypingField && baseH > 0 && window.innerHeight < baseH * 0.62);

              if (nativeMultiWin || (isAndroidDevice && (isHorizontalSplitOrFloating || isVerticalSplit))) {
                  triggerLockdownViolation('LOCKDOWN ANDROID: Percobaan Split Screen / Floating Aplikasi Terdeteksi!', true);
              }
          };

          const handleContextMenu = (e) => e.preventDefault();
          const handleVisibilityChange = () => {
              if (document.hidden && view === 'ujian' && !isExamFinishedRef.current && appSettings.ujian_ketat === 'Ya') {
                  triggerLockdownViolation('LOCKDOWN MODE: Terdeteksi mencoba keluar dari aplikasi / pindah layar!', true);
              }
          };
          const handleFullscreenChange = () => {
              if (view === 'ujian' && !isExamFinishedRef.current && (appSettings.kiosk_mode === 'Ya' || appSettings.ujian_ketat === 'Ya') && !document.fullscreenElement) {
                  setFullscreenWarning(true);
                  triggerLockdownViolation('LOCKDOWN MODE: Siswa keluar dari Mode Layar Penuh!', isAndroidDevice);
              }
          };
          const handleKeyDown = (e) => {
              if (view !== 'ujian' || isExamFinishedRef.current) return;
              if (e.key === 'F12' || e.key === 'PrintScreen' ||
                  ((e.ctrlKey || e.metaKey) && ['c','x','u','p','s'].includes(e.key.toLowerCase())) ||
                  ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c','s'].includes(e.key.toLowerCase()))) {
                  e.preventDefault();
                  if (e.key === 'PrintScreen' && appSettings.ujian_ketat === 'Ya') {
                      triggerLockdownViolation('LOCKDOWN MODE: Percobaan Screenshot / Tangkap Layar Terdeteksi!', true);
                  }
              }
          };
          document.addEventListener('contextmenu', handleContextMenu);
          document.addEventListener('visibilitychange', handleVisibilityChange);
          document.addEventListener('fullscreenchange', handleFullscreenChange);
          document.addEventListener('keydown', handleKeyDown);
          window.addEventListener('resize', checkSplitScreenOrFloating);
          return () => {
              delete window.onAndroidLockdownViolation;
              document.removeEventListener('contextmenu', handleContextMenu);
              document.removeEventListener('visibilitychange', handleVisibilityChange);
              document.removeEventListener('fullscreenchange', handleFullscreenChange);
              document.removeEventListener('keydown', handleKeyDown);
              window.removeEventListener('resize', checkSplitScreenOrFloating);
          };
      }, [view, appSettings.ujian_ketat, appSettings.kiosk_mode, user, isAndroidDevice]);

      // ANTI-CURANG AUDIO MONITORING (Jika diaktifkan Admin)
      useEffect(() => {
          if (view !== 'ujian' || appSettings.audio_monitoring !== 'Ya') return;
          let audioCtx = null;
          let micStream = null;
          let audioTimer = null;
          let loudStreak = 0;
          let lastReportTime = 0;

          const initAudio = async () => {
              try {
                  micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                  const AudioContextCls = window.AudioContext || window.webkitAudioContext;
                  if (!AudioContextCls) return;
                  audioCtx = new AudioContextCls();
                  const source = audioCtx.createMediaStreamSource(micStream);
                  const analyser = audioCtx.createAnalyser();
                  analyser.fftSize = 256;
                  source.connect(analyser);
                  const dataArr = new Uint8Array(analyser.frequencyBinCount);

                  audioTimer = setInterval(() => {
                      analyser.getByteFrequencyData(dataArr);
                      let sum = 0;
                      for (let i = 0; i < dataArr.length; i++) sum += dataArr[i];
                      const avg = sum / dataArr.length;
                      if (avg > 45) {
                          loudStreak++;
                          setAudioStatus('Suara Bising Terdeteksi!');
                          if (loudStreak >= 3 && Date.now() - lastReportTime > 20000) {
                              lastReportTime = Date.now();
                              if (user && user.nis && typeof google !== 'undefined' && google.script) {
                                  google.script.run.laporSuaraMencurigakan(user.nis, user.nama);
                              }
                          }
                      } else {
                          loudStreak = 0;
                          setAudioStatus('Audio Tenang (Normal)');
                      }
                  }, 2000);
              } catch (e) { setAudioStatus('Mikrofon Nonaktif'); }
          };
          initAudio();
          return () => {
              if (audioTimer) clearInterval(audioTimer);
              if (micStream) micStream.getTracks().forEach(t => t.stop());
              if (audioCtx && audioCtx.close) audioCtx.close().catch(() => {});
          };
      }, [view, appSettings.audio_monitoring, user]);

      useEffect(() => {
          if (view === 'ujian' && user) {
              localStorage.setItem(`cbt_state_${user.nis}`, JSON.stringify({ jawaban: jawaban, timeLeft: timeLeft }));
          }
      }, [jawaban, timeLeft, user, view]);

      // Auto-sync cepat ketika siswa mengisi Nama Ruang di intro atau di dalam soal Google Form
      const detectedGFormRuang = extractGFormRuang(soalList, jawaban) || selectedRuang;
      useEffect(() => {
          if (view !== 'ujian' || !user || !detectedGFormRuang) return;
          if (detectedGFormRuang !== selectedRuangRef.current) {
              setSelectedRuang(detectedGFormRuang);
              selectedRuangRef.current = detectedGFormRuang;
              try { localStorage.setItem(`cbt_ruang_${user.nis}`, detectedGFormRuang); } catch(e) {}
          }
          if (detectedGFormRuang === lastSyncedRuangRef.current) return;
          const t = setTimeout(() => {

              }

      }, [detectedGFormRuang, view, user]);

      useEffect(() => {
          if (view === 'ujian' && user) {
              const baseInterval = 30000;

              const saveInterval = setInterval(() => {
                  if (typeof google !== 'undefined' && google.script) {
                      const curRuang = extractGFormRuang(soalListRef.current, jawabanRef.current) || selectedRuangRef.current;
                      const totalAns = (soalListRef.current || []).filter(q => !['SECTION_HEADER', 'IMAGE', 'VIDEO'].includes(q.tipe)).length;
                      if (curRuang) lastSyncedRuangRef.current = curRuang;

                      }).saveJawabanSementara(user.nis, JSON.stringify(jawabanRef.current), timeLeftRef.current, curRuang, totalAns);

      }, [view, user]);

      const shuffleArray = (array) => {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      };

      const formatMediaUrl = (url) => {
          if (!url) return '';
          let clean = String(url).trim();
          const gdriveMatch = clean.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || clean.match(/id=([a-zA-Z0-9_-]+)/) || clean.match(/\/d\/([a-zA-Z0-9_-]+)/);
          if (gdriveMatch && (clean.includes('drive.google.com') || clean.includes('docs.google.com'))) {
              return `https://drive.google.com/uc?export=view&id=${gdriveMatch[1]}`;
          }
          if (clean.includes('dropbox.com') && clean.includes('dl=0')) {
              return clean.replace('dl=0', 'raw=1');
          }
          return clean;
      };

      const stripGFormLeadingNumber = (text) => {
          if (text === undefined || text === null) return '';
          let s = String(text).replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/\u00A0/g, ' ').trim();
          let prev = '';
          while (s !== prev) {
              prev = s;
              s = s
                  .replace(/^\s*(?:(?:No\.?|Nomor|Nomer|Soal|Pertanyaan)\s*(?:No\.?|Nomor|#)?\s*\d{1,3}\s*[.:)\-–—]?\s+)/i, '')
                  .replace(/^\s*[\(\[]\s*\d{1,3}\s*[\)\]]\s*[.:)\-–—]?\s*/, '')
                  .replace(/^\s*\d{1,3}(?:\.\d{1,2})?\s*[.):\-–—]\s+(?=\S)/, '')
                  .replace(/^\s*\d{1,3}[.)](?=[^\d\s.,])/, '')
                  .replace(/^\s*\d{1,3}\s+(?=(?:Nama|Kelas|NIS|NISN|No\.?|Nomor|Nomer|Absen|Ruang|Sesi|Token|Mapel|Mata\s+Pelajaran|Tanggal|Hari|Sekolah|Asal|Identitas|Biodata|Pilih|Isilah|Bacalah|Perhatikan|Tentukan|Berapakah|Mengapa|Apa|Siapa|Dimana|Kapan|Bagaimana|Jelaskan)\b)/i, '')
                  .trim();
          }
          return s || String(text).trim();
      };

      const renderContent = (text) => {
          if (!text) return null;
          const parts = String(text).split(/(\[(?:img|gambar|image|audio|suara|mp3|video|mp4)\s*:\s*.*?\])/gi);
          return parts.map((part, index) => {
              const cleanPart = part.trim();
              if (/^\[(?:img|gambar|image)\s*:/i.test(cleanPart)) {
                  const rawUrl = cleanPart.replace(/^\[(?:img|gambar|image)\s*:/i, '').replace(/\]$/, '').trim();
                  const url = formatMediaUrl(rawUrl);
                  return (
                    <div key={index} className="my-3 flex justify-center">
                      <img src={url} alt="Media Soal" className="max-w-full h-auto max-h-72 rounded-xl border border-slate-200 shadow-md object-contain" onError={(e)=>{e.target.style.display='none';}} />
                    </div>
                  );
              } else if (/^\[(?:audio|suara|mp3)\s*:/i.test(cleanPart)) {
                  const rawUrl = cleanPart.replace(/^\[(?:audio|suara|mp3)\s*:/i, '').replace(/\]$/, '').trim();
                  const url = formatMediaUrl(rawUrl);
                  const lim = appSettings.audio_limit && appSettings.audio_limit !== 'Tanpa Batas' ? parseInt(appSettings.audio_limit) : 0;
                  return <LimitedAudioPlayer key={index} url={url} limit={lim} />;
              } else if (/^\[(?:video|mp4)\s*:/i.test(cleanPart)) {
                  const rawUrl = cleanPart.replace(/^\[(?:video|mp4)\s*:/i, '').replace(/\]$/, '').trim();
                  const url = formatMediaUrl(rawUrl);
                  return (
                    <div key={index} className="my-3 flex justify-center">
                      <video controls className="w-full max-w-lg rounded-xl border border-slate-200 shadow-md">
                        <source src={url} />
                        Browser Anda tidak mendukung pemutaran video.
                      </video>
                    </div>
                  );
              } else {
                  return <span key={index} dangerouslySetInnerHTML={{__html: part.replace(/\n/g, '<br/>')}} />;
              }
          });
      };

      const handleLogin = (e) => {
        e.preventDefault();

        setIsLoading(true); setErrorMessage(''); setResumeMessage('');
        const fingerprint = getDeviceFingerprint();
        const browserDesc = getDeviceDesc();

        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((res) => {
              if (res.success) { 
                  setUser(res.data);
                  const savedRuangLocal = localStorage.getItem(`cbt_ruang_${res.data.nis}`) || res.data.selectedRuang || '';
                  setSelectedRuang(savedRuangLocal);
                  selectedRuangRef.current = savedRuangLocal;
                  setView('intro');
                  localStorage.setItem('cbt_siswa_user', JSON.stringify(res.data));
                  
                  let restoredTime = null; let restoredAnswers = null;
                  if (res.data.tempState) {
                      if (res.data.tempState.timeLeft) restoredTime = res.data.tempState.timeLeft;
                      if (res.data.tempState.answers) { try { restoredAnswers = JSON.parse(res.data.tempState.answers); } catch(e){} }
                  }

                  const localDataStr = localStorage.getItem(`cbt_state_${res.data.nis}`);
                  if (localDataStr) {
                      try {
                          const localParsed = JSON.parse(localDataStr);
                          if (!restoredTime || localParsed.timeLeft < restoredTime) {
                              restoredTime = localParsed.timeLeft; restoredAnswers = localParsed.jawaban;
                          }
                      } catch(e) {}
                  }

                  if (restoredAnswers) setJawaban(restoredAnswers);
                  if (restoredTime) {
                      setTimeLeft(restoredTime);
                      setResumeMessage('Sistem berhasil memulihkan jawaban dan sisa waktu pengerjaan Anda sebelumnya.');
                  }
                  const gformOverride = res.data.gformLink ? ((res.data.gformLink.formId && !/^1FAIpQL/.test(res.data.gformLink.formId)) ? res.data.gformLink.formId : (res.data.gformLink.formUrl || res.data.gformLink.formId)) : '';
                  fetchSoal(res.data.kelas, res.data.mapel || appSettings.nama_ujian, res.data.nis, gformOverride, res.data); 
              } 
              else { setErrorMessage(res.message); setIsLoading(false); }
            }).withFailureHandler((err) => {
              setErrorMessage("Koneksi server gagal. Muat ulang halaman."); setIsLoading(false);
            })
            .loginSiswa(loginForm.nis, loginForm.password, '', fingerprint, browserDesc);
        } else {
          setIsLoading(false); setErrorMessage('Error: Google Script API tidak ditemukan.');
        }
      };

      const handleSiswaLogout = () => {
          localStorage.removeItem('cbt_siswa_user');
          localStorage.removeItem(`cbt_state_${user?.nis}`);
          localStorage.removeItem(`cbt_soal_${user?.nis}`);
          localStorage.removeItem(`cbt_gform_meta_${user?.nis}`);
          localStorage.removeItem(`cbt_ruang_${user?.nis}`);
          window.location.reload();
      };

      const startUjian = () => {
        unlockLockdownAudio();
        if (!selectedRuang) return alert("Harap pilih Ruang Ujian Anda terlebih dahulu (Ruang 1 - Ruang 14) sebelum masuk ke soal!");
        if (!isAgreed) return alert("Anda harus menyetujui pakta integritas!");
        if (isLoading) return alert("Sedang memuat soal dari server, mohon tunggu beberapa detik.");
        if (!soalList || soalList.length === 0) {
            if (user) {
                fetchSoal(user.kelas, user.mapel || appSettings.nama_ujian, user.nis, user.gformLink ? (user.gformLink.formUrl || user.gformLink.formId) : '', user);
            }
            return alert(errorMessage || "Soal belum berhasil dimuat. Sistem sedang mencoba memuat ulang soal.");
        }
        if (appSettings.exambro_only === 'Ya') {
            const ua = navigator.userAgent || '';
            if (!/Exambro|SEB|SafeExamBrowser/i.test(ua)) {
                return alert("PERHATIAN: Ujian ini dikhususkan menggunakan aplikasi resmi CBT Exambro Lockdown Android / Safe Exam Browser. Akses dari browser biasa diblokir.");
            }
        }
        try {
            if (window.AndroidExambro && typeof window.AndroidExambro.isInMultiWindow === 'function' && window.AndroidExambro.isInMultiWindow()) {
                startLockdownAlarm('Tutup Split Screen terlebih dahulu');
                return alert("PERINGATAN LOCKDOWN MODE: Nonaktifkan mode Split Screen / Floating Window terlebih dahulu sebelum memulai ujian!");
            }
        } catch (eMw) {}
        if (appSettings.ujian_ketat === 'Ya' || appSettings.kiosk_mode === 'Ya') {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen().catch(e=>console.log(e));
        }
        try {
            if (window.AndroidExambro && typeof window.AndroidExambro.startLockdown === 'function') {
                window.AndroidExambro.startLockdown();
            }
        } catch (eLd) {}

        // Prefill pertanyaan Ruang di Google Form (jika masih kosong) sesuai pilihan Ruang siswa
        let nextAnsSnapshot = { ...(jawabanRef.current || {}) };
        let prefillChanged = false;
        const roomNumMatch = selectedRuang.match(/(\d+)/);
        const roomNumStr = roomNumMatch ? roomNumMatch[1] : '';
        soalList.forEach(q => {
            if (!q || ['SECTION_HEADER', 'IMAGE', 'VIDEO'].includes(q.tipe)) return;
            const lbl = `${q.text || ''} ${q.helpText || ''}`;
            if (/ruang|room|r\.\s*ujian/i.test(lbl) && !nextAnsSnapshot[q.id]) {
                if (q.tipe === 'ISIAN') {
                    nextAnsSnapshot[q.id] = selectedRuang;
                    prefillChanged = true;
                } else if ((q.tipe === 'DROPDOWN' || q.tipe === 'PG') && Array.isArray(q.opsi)) {
                    const matchedOpt = q.opsi.find(o => {
                        const rawOpt = String(o || '').trim();
                        const normOpt = rawOpt.toLowerCase().replace(/[-_.]+/g, ' ').replace(/\s+/g, ' ').replace(/\b0+(\d+)/g, '$1');
                        return normOpt === selectedRuang.toLowerCase() || (roomNumStr && (normOpt === roomNumStr || normOpt === `r ${roomNumStr}` || normOpt === `ruang ${roomNumStr}`));
                    });
                    if (matchedOpt) {
                        nextAnsSnapshot[q.id] = matchedOpt;
                        prefillChanged = true;
                    }
                }
            }
        });
        if (prefillChanged) {
            setJawaban(nextAnsSnapshot);
            jawabanRef.current = nextAnsSnapshot;
        }

        setView('ujian');
        if (user && typeof google !== 'undefined' && google.script) {
            const initRuang = extractGFormRuang(soalList, nextAnsSnapshot) || selectedRuangRef.current;
            const totalAns = (soalList || []).filter(q => !['SECTION_HEADER', 'IMAGE', 'VIDEO'].includes(q.tipe)).length;
            if (initRuang) {
                lastSyncedRuangRef.current = initRuang;
                google.script.run.saveRuangSiswa(user.nis, initRuang);
            }
            google.script.run.saveJawabanSementara(user.nis, JSON.stringify(nextAnsSnapshot), timeLeftRef.current, initRuang, totalAns);
        }
        const timer = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev === 600 && !warningTriggered) { setShowTimeWarning(true); setWarningTriggered(true); }
            if (prev <= 1) { clearInterval(timer); handleSubmitUjian(true); return 0; }
            return prev - 1;
          });
        }, 1000);
      };

      const handlePilihJawaban = (idSoal, jawabanDipilih) => {
          setJawaban(prev => ({ ...prev, [idSoal]: jawabanDipilih }));
          if (missingRequiredId === idSoal && jawabanDipilih && String(jawabanDipilih).trim() !== '' && String(jawabanDipilih) !== '{}') {
              setMissingRequiredId(null);
          }
          if (appSettings.adaptif_cat === 'Ya') {
              const currentSoal = soalList[idSoal];
              if (currentSoal) {
                  const correct = evaluateSoalCorrectness(currentSoal, jawabanDipilih);
                  setCatLevel(correct ? 'SULIT' : 'MUDAH');
              }
          }
      };

      const executeSubmitWithRetry = (nis, nama, token, score, status, ansString, analisaString, hashSig, gformPayloadJson, ruangSiswa = '', attempt = 1) => {
        const maxAttempts = 6; 
        const delay = Math.pow(2, attempt) * 1000 + Math.random() * 2000; 

        if (attempt > 1) setSubmitStatusText(`Server penuh (Antrean ${attempt}/${maxAttempts}). Mengirim otomatis dalam ${Math.round(delay/1000)} detik...`);
        else setSubmitStatusText(gformPayloadJson ? 'Mengirim jawaban ke Google Form & merekam ke Spreadsheet...' : 'Menghubungkan ke server untuk merekam jawaban secara aman...');

        setTimeout(() => {
          if (typeof google !== 'undefined' && google.script) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) {
                  isExamFinishedRef.current = true;
                  stopLockdownAlarm();
                  setCheatWarning(false);
                  setFullscreenWarning(false);
                  setLockdownViolationMsg('');
                  try { window.AndroidExambro?.stopLockdown?.(); } catch (eLd) {}
                  if (user) {
                      localStorage.removeItem(`cbt_state_${user.nis}`);
                      localStorage.removeItem(`cbt_soal_${user.nis}`);
                      localStorage.removeItem(`cbt_gform_meta_${user.nis}`);
                      localStorage.removeItem('cbt_siswa_user'); 
                  }
                  setSubmitStatusText(''); setIsLoading(false); setView('selesai');
                } else {
                  if (attempt < maxAttempts) executeSubmitWithRetry(nis, nama, token, score, status, ansString, analisaString, hashSig, gformPayloadJson, ruangSiswa, attempt + 1);
                  else {
                      cbtIDB.addOfflineSubmit({ nis, nama, token, score, status, ansString, analisaString, hashSig, gformPayloadJson, ruangSiswa, timestamp: Date.now() });
                      isExamFinishedRef.current = true;
                      stopLockdownAlarm();
                      setCheatWarning(false);
                      setFullscreenWarning(false);
                      setLockdownViolationMsg('');
                      try { window.AndroidExambro?.stopLockdown?.(); } catch (eLd) {}
                      if (user) {
                          localStorage.removeItem(`cbt_state_${user.nis}`);
                          localStorage.removeItem(`cbt_soal_${user.nis}`);
                          localStorage.removeItem(`cbt_gform_meta_${user.nis}`);
                          localStorage.removeItem('cbt_siswa_user');
                      }
                      setSubmitStatusText(''); setIsLoading(false);
                      alert("Koneksi server sibuk/offline. Jawaban Anda telah BERHASIL DIAMANKAN secara lokal di IndexedDB (Offline-First Mode). Sistem menyinkronkan otomatis di latar belakang.");
                      setView('selesai');
                  }
                }
              })
              .withFailureHandler((err) => {
                if (attempt < maxAttempts) executeSubmitWithRetry(nis, nama, token, score, status, ansString, analisaString, hashSig, gformPayloadJson, ruangSiswa, attempt + 1);
                else {
                  isExamFinishedRef.current = false;
                  setSubmitStatusText(''); setIsLoading(false); alert("Kesalahan Jaringan Parah. Harap panggil Proktor.");
                }
              })
              .submitUjian(nis, nama, token, score, status, ansString, analisaString, hashSig || '', gformPayloadJson || '', ruangSiswa || '');
          } else {
            isExamFinishedRef.current = true;
            stopLockdownAlarm();
            setCheatWarning(false);
            setFullscreenWarning(false);
            try { window.AndroidExambro?.stopLockdown?.(); } catch (eLd) {}
            setIsLoading(false); setView('selesai');
          }
        }, attempt === 1 ? 0 : delay); 
      };

      const buildGFormSubmitPayload = (activeSoal = null, activeAns = null, activeMeta = null, activeUser = null, activeSettings = null) => {
        const gfMetaObj = activeMeta || gformMetaRef.current || gformMeta;
        if (!gfMetaObj) return '';
        const list = activeSoal || soalListRef.current || soalList || [];
        const ansObj = activeAns || jawabanRef.current || jawaban || {};
        const usr = activeUser || userRef.current || user;
        const cfg = activeSettings || appSettingsRef.current || appSettings;
        const responses = {};
        const httpEntries = {};

        list.forEach(q => {
            if (!q || ['SECTION_HEADER', 'IMAGE', 'VIDEO'].includes(q.tipe)) return;
            let rawAns = ansObj[q.id];
            const tipe = (q.tipe || 'PG').toUpperCase();

            // Pastikan kolom identitas (Nama / NIS / Kelas / Ruang) terisi otomatis jika masih kosong
            if ((rawAns === undefined || rawAns === null || String(rawAns).trim() === '') && usr) {
                const lbl = stripGFormLeadingNumber(q.text || '').toLowerCase();
                if (tipe === 'ISIAN') {
                    if (lbl.includes('nama') && !lbl.includes('sekolah') && !lbl.includes('ayah') && !lbl.includes('ibu')) rawAns = usr.nama || '';
                    else if (lbl.includes('nis') || lbl.includes('nomor peserta') || lbl.includes('no peserta')) rawAns = usr.nis || '';
                    else if (lbl.includes('kelas') || lbl.includes('rombel')) rawAns = usr.kelas || '';
                    else if (/ruang|room|r\.\s*ujian/i.test(lbl)) rawAns = selectedRuangRef.current || usr.ruang || '';
                } else if ((tipe === 'DROPDOWN' || tipe === 'PG') && Array.isArray(q.opsi)) {
                    if (lbl.includes('kelas') || lbl.includes('rombel')) {
                        const normCls = String(usr.kelas || '').toLowerCase().replace(/[-_.\/\s]+/g, '');
                        const mCls = q.opsi.find(o => String(o || '').toLowerCase().replace(/[-_.\/\s]+/g, '') === normCls);
                        if (mCls) rawAns = mCls;
                    } else if (/ruang|room|r\.\s*ujian/i.test(lbl)) {
                        const curRm = selectedRuangRef.current || usr.ruang || '';
                        const rmNum = (curRm.match(/(\d+)/) || [])[1];
                        const mRm = q.opsi.find(o => {
                            const normOpt = String(o || '').toLowerCase().replace(/[-_.]+/g, ' ').replace(/\s+/g, ' ').replace(/\b0+(\d+)/g, '$1').trim();
                            return normOpt === curRm.toLowerCase() || (rmNum && (normOpt === rmNum || normOpt === `r ${rmNum}` || normOpt === `ruang ${rmNum}`));
                        });
                        if (mRm) rawAns = mRm;
                    }
                }
            }

            if (tipe === 'PG_KOMPLEKS') {
                const arr = Array.isArray(rawAns) ? rawAns : (rawAns ? String(rawAns).split('|||').filter(Boolean) : []);
                if (q.itemId) responses[q.itemId] = arr;
                if (q.entryId) httpEntries['entry.' + q.entryId] = arr;
            } else if (tipe === 'GRID' || tipe === 'BENAR_SALAH') {
                const rows = q.gridRows || q.opsi || [];
                let parsedMap = {};
                if (rawAns) {
                    try { parsedMap = typeof rawAns === 'object' ? rawAns : JSON.parse(rawAns); } catch(e) {}
                }
                const rowArr = rows.map((_, rIdx) => parsedMap[rIdx] || '');
                if (q.itemId) responses[q.itemId] = rowArr;
                if (Array.isArray(q.entryIds)) {
                    q.entryIds.forEach((eid, rIdx) => {
                        if (eid && rowArr[rIdx]) httpEntries['entry.' + eid] = rowArr[rIdx];
                    });
                }
            } else if (tipe === 'CHECKBOX_GRID') {
                const rows = q.gridRows || q.opsi || [];
                let parsedMap = {};
                if (rawAns) {
                    try { parsedMap = typeof rawAns === 'object' ? rawAns : JSON.parse(rawAns); } catch(e) {}
                }
                const rowArrs = rows.map((_, rIdx) => Array.isArray(parsedMap[rIdx]) ? parsedMap[rIdx] : []);
                if (q.itemId) responses[q.itemId] = rowArrs;
                if (Array.isArray(q.entryIds)) {
                    q.entryIds.forEach((eid, rIdx) => {
                        if (eid && rowArrs[rIdx] && rowArrs[rIdx].length > 0) httpEntries['entry.' + eid] = rowArrs[rIdx];
                    });

        return cfg;
