                      if (inMulti || (isAndroidDevice && ((scrW > 0 && window.outerWidth < scrW * 0.84) || (scrH > 0 && window.outerHeight < scrH * 0.72)))) {
                        startLockdownAlarm('Masih dalam Split Screen');
                        return alert('Split Screen / Floating App masih aktif! Tutup dulu agar layar penuh kembali.');
                      }
                      stopLockdownAlarm();
                      setCheatWarning(false);
                      setLockdownViolationMsg('');
                      try { window.AndroidExambro?.startLockdown?.(); } catch (e) {}
                      if ((appSettings.kiosk_mode === 'Ya' || appSettings.ujian_ketat === 'Ya') && document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                      }
                    }} className="px-7 py-4 bg-white text-rose-700 font-black rounded-2xl hover:bg-rose-50 transition-colors shadow-2xl text-sm sm:text-base">
                        Matikan Alarm &amp; Kembali ke Lockdown Mode
                    </button>
                </div>
            )}

            {/* OVERLAY ANTI-CURANG: KELUAR FULLSCREEN */}
            {fullscreenWarning && !cheatWarning && (
                <div className="fixed inset-0 z-[9998] bg-slate-900/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
                    <Lock size={72} className="text-amber-400 mb-5 animate-bounce" />
                    <h2 className="text-2xl sm:text-3xl font-black text-white mb-3">LOCKDOWN LAYAR PENUH TERHENTI</h2>
                    <p className="text-slate-200 text-sm sm:text-base max-w-md mb-7">Ujian menggunakan Lockdown Mode. Anda wajib mengaktifkan Layar Penuh untuk melanjutkan soal.</p>
                    <button onClick={() => {
                      stopLockdownAlarm();
                      setFullscreenWarning(false);
                      try { window.AndroidExambro?.startLockdown?.(); } catch (e) {}
                      if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                      }
                    }} className="px-7 py-3.5 bg-[#673ab7] hover:bg-[#5e35b1] text-white font-bold rounded-xl shadow-lg">
                        Aktifkan Lockdown Mode &amp; Lanjutkan
                    </button>
                </div>
            )}

            {/* BAR STATUS MINIMALIS: LOCKDOWN MODE & TIMER */}
            <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-[#dadce0] px-3 sm:px-6 py-2 shadow-[0_1px_2px_rgba(60,64,67,0.1)] prevent-select">
              <div className="max-w-[640px] mx-auto flex justify-between items-center gap-2">
                <div className="flex items-center gap-2 min-w-0">
                  <span className="inline-flex items-center gap-1 px-2 py-0.5 bg-rose-50 border border-rose-200 text-rose-700 text-[10px] font-bold rounded-full shrink-0">
                    <Lock size={10}/> {isAndroidDevice || isAndroidApk ? 'Lockdown Android' : 'Lockdown'}
                  </span>
                  <span className="text-xs font-medium text-[#5f6368] truncate">{user?.nama} &bull; {user?.kelas}</span>
                  {appSettings.ai_face_liveness === 'Ya' && (
                    <span className={`px-1.5 py-0.5 text-[10px] font-medium rounded hidden sm:inline-block ${faceStatus.includes('Normal') ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-100 text-rose-700 animate-pulse'}`}>
                      {faceStatus}
                    </span>
                  )}
                </div>

                <div className="flex items-center gap-1.5 shrink-0">
                  <div className="hidden sm:flex items-center bg-[#f1f3f4] p-0.5 rounded-md gap-0.5">
                    <button type="button" onClick={() => setFontSize(prev => Math.max(13, prev - 1))} className="p-1 hover:bg-white text-[#5f6368] rounded" title="Perkecil Huruf"><ZoomOut size={13} /></button>
                    <button type="button" onClick={() => setFontSize(prev => Math.min(22, prev + 1))} className="p-1 hover:bg-white text-[#5f6368] rounded" title="Perbesar Huruf"><ZoomIn size={13} /></button>
                  </div>

                  {appSettings.coretan !== 'Tidak' && (
                    <button type="button" onClick={() => setShowPad(!showPad)} className={`p-1.5 rounded-md border text-xs ${showPad ? 'bg-[#673ab7] text-white border-[#673ab7]' : 'bg-white text-[#5f6368] border-[#dadce0] hover:bg-slate-50'}`} title="Kertas Coretan"><Palette size={14} /></button>
                  )}

                  <div className="bg-rose-50 border border-rose-200 px-2.5 py-1 rounded-md text-[#d93025] font-mono font-bold text-xs">
                    {formatTime(timeLeft)}
                  </div>
                </div>
              </div>
            </header>

            {/* MAIN AUTHENTIC GOOGLE FORM LAYOUT (LEBAR STANDAR 640PX, TANPA NOMOR SOAL) */}
            <main
              className="flex-1 w-full max-w-[640px] mx-auto px-3 pt-4 pb-16 space-y-3"
              onCopy={(e) => { if (!['INPUT', 'TEXTAREA'].includes(e.target.tagName)) e.preventDefault(); }}
              onCut={(e) => { if (!['INPUT', 'TEXTAREA'].includes(e.target.tagName)) e.preventDefault(); }}
              onPaste={(e) => { if (appSettings.ujian_ketat === 'Ya') e.preventDefault(); }}
            >
              {/* KARTU JUDUL GOOGLE FORM */}
              <div className="bg-white rounded-lg border border-[#dadce0] overflow-hidden">
                <div className="h-[10px] bg-[#673ab7] w-full"></div>
                <div className="px-6 pt-5 pb-4 space-y-2.5">
                  <h1 className="text-[24px] sm:text-[32px] font-normal text-[#202124] leading-[1.25] tracking-[-0.01em]">{formTitle}</h1>
                  {formDesc && (
                    <p className="text-[14px] text-[#202124] whitespace-pre-line leading-[1.43]">{formDesc}</p>
                  )}
                </div>
                <div className="px-6 py-3 border-t border-[#dadce0] flex flex-wrap items-center justify-between gap-2 text-[13px] text-[#5f6368]">
                  <div className="flex flex-wrap items-center gap-1.5">
                    <span className="font-medium text-[#3c4043]">{user?.nama}</span>
                    <span>({user?.nis} &bull; {user?.kelas})</span>
                    <span className="inline-flex items-center gap-1 ml-1">
                      <GFormDropdown
                        className="w-36"
                        value={detectedGFormRuang || selectedRuang || ''}
                        options={Array.from({ length: 14 }, (_, idx) => `Ruang ${idx + 1}`)}
                        placeholder="-- Pilih Ruang --"
                        onChange={(v) => {
                          handleSelectRuangSiswa(v);
                          if (user && v && typeof google !== 'undefined' && google.script) {
                            const totalAns = (soalListRef.current || []).filter(q => !['SECTION_HEADER', 'IMAGE', 'VIDEO'].includes(q.tipe)).length;
                            google.script.run.saveJawabanSementara(user.nis, JSON.stringify(jawabanRef.current), timeLeftRef.current, v, totalAns);
                          }
                        }}
                        buttonClassName={`w-full px-2 py-0.5 rounded border text-[11px] font-medium outline-none cursor-pointer flex items-center justify-between gap-1 ${
                          (detectedGFormRuang || selectedRuang)
                            ? 'bg-purple-50 border-purple-300 text-[#673ab7]'
                            : 'bg-amber-50 border-amber-300 text-amber-800'
                        }`}
                      />
                    </span>
                  </div>
                  <span className="inline-flex items-center gap-1 text-[12px] text-[#5f6368]">
                    <CheckCircle size={13} className="text-[#5f6368]" /> Tersimpan
                  </span>
                </div>
                <div className="px-6 py-3 border-t border-[#dadce0] text-[14px] text-[#d93025]">
                  * Menunjukkan pertanyaan yang wajib diisi
                </div>
              </div>

              {/* BANNER BAGIAN (JIKA GOOGLE FORM MEMILIKI MULTI-SECTION) */}
              {totalSections > 1 && currentSecIdx > 0 && (
                <div className="rounded-lg border border-[#dadce0] bg-white overflow-hidden">
                  <div className="bg-[#673ab7] text-white px-6 py-3 text-[16px] font-normal">
                    {stripGFormLeadingNumber(currentSecMeta.title)}
                  </div>
                  {currentSecMeta.description && (
                    <div className="px-6 py-4 text-[14px] text-[#202124] whitespace-pre-line leading-[1.43]">{currentSecMeta.description}</div>
                  )}
                </div>
              )}

              {/* KARTU JIKA SOAL KOSONG / GAGAL DIMUAT */}
              {visibleItems.length === 0 && (
                <div className="bg-white rounded-lg border border-[#dadce0] p-6 text-center space-y-3">
                  <AlertTriangle size={36} className="text-[#d93025] mx-auto" />
                  <h3 className="text-base font-medium text-[#202124]">Soal Ujian Belum Tampil</h3>
                  <p className="text-xs sm:text-sm text-[#5f6368] max-w-md mx-auto">
                    {errorMessage || 'Tidak ada butir soal yang berhasil dimuat dari Google Form / Bank Soal untuk kelas dan mata pelajaran Anda.'}
                  </p>
                  <div className="flex flex-wrap justify-center gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => user && fetchSoal(user.kelas, user.mapel || appSettings.nama_ujian, user.nis, user.gformLink ? (user.gformLink.formUrl || user.gformLink.formId) : '', user)}
                      className="px-5 py-2 bg-[#673ab7] hover:bg-[#5e35b1] text-white rounded-[4px] text-sm font-medium inline-flex items-center gap-1.5"
                    >
                      <RefreshCw size={14} className={isLoading ? 'animate-spin' : ''}/> Muat Ulang Soal
                    </button>
                    <button
                      type="button"
                      onClick={() => setView('intro')}
                      className="px-4 py-2 bg-white border border-[#dadce0] hover:bg-slate-50 text-[#5f6368] rounded-[4px] text-sm font-medium"
                    >
                      Kembali
                    </button>
                  </div>
                </div>
              )}

              {/* DAFTAR KARTU PERTANYAAN GAYA GOOGLE FORM ASLI (TANPA NOMOR SOAL) */}
              {visibleItems.map((q) => {
                const globalIdx = soalList.findIndex(x => x.id === q.id);
                const cleanTitle = stripGFormLeadingNumber(q.text);

                if (q.tipe === 'SECTION_HEADER') {
                  return (
                    <div key={q.id} className="bg-white rounded-lg border border-[#dadce0] overflow-hidden">
                      <div className="bg-[#673ab7] text-white px-6 py-3 text-[16px] font-normal">
                        {cleanTitle}
                      </div>
                      {q.helpText && (
                        <div className="px-6 py-4 text-[14px] text-[#202124] whitespace-pre-line leading-[1.43]">{q.helpText}</div>
                      )}
                    </div>
                  );
                }

                if (q.tipe === 'IMAGE' || q.tipe === 'VIDEO') {
                  return (
                    <div key={q.id} className="bg-white rounded-lg border border-[#dadce0] p-6">
                      {cleanTitle && <h4 className="text-[16px] font-normal text-[#202124] mb-2">{cleanTitle}</h4>}
                      {q.helpText && <p className="text-[12px] text-[#5f6368] mb-3">{q.helpText}</p>}
                      {q.imageDataUrl && (
                        <div className="flex justify-center">
                          <img src={q.imageDataUrl} alt={cleanTitle || 'Gambar'} className="max-w-full max-h-96 rounded object-contain" />
                        </div>
                      )}
                    </div>
                  );
                }

                const isMissingError = missingRequiredId === q.id;

                return (
                  <div
                    key={q.id}
                    id={`soal-card-${globalIdx}`}
                    className={`bg-white rounded-lg border p-6 transition-colors prevent-select focus-within:border-l-[6px] focus-within:border-l-[#4285f4] ${
                      isMissingError ? 'border-[#d93025]' : 'border-[#dadce0]'
                    }`}
                  >
                    <div className="mb-3 flex items-start justify-between gap-3">
                      <div className="text-[#202124] font-normal leading-[1.5] flex-1" style={{ fontSize: `${fontSize}px` }}>
                        {renderContent(cleanTitle)}
                        {q.isRequired && <span className="text-[#d93025] ml-1">*</span>}
                      </div>
                    </div>
                    {q.helpText && (
                      <p className="text-[12px] text-[#5f6368] -mt-1.5 mb-3 whitespace-pre-line">{q.helpText}</p>
                    )}
                    {q.imageDataUrl && (
                      <div className="my-3 flex justify-center">
                        <img src={q.imageDataUrl} alt="Gambar" className="max-w-full max-h-72 rounded object-contain" />
                      </div>
                    )}
                    <div className="mt-1">
                      {renderOpsiAKM(q)}
                    </div>
                    {isMissingError && (
                      <div className="mt-3 pt-2 flex items-center gap-1.5 text-[#d93025] text-[12px] font-normal">
                        <AlertTriangle size={15} className="shrink-0" />
                        <span>Pertanyaan ini wajib diisi</span>
                      </div>
                    )}
                  </div>
                );
              })}

              {/* BAR NAVIGASI & TOMBOL KIRIM GAYA GOOGLE FORM ASLI */}
              <div className="pt-2 flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-2.5">
                  {currentSecIdx > 0 && (
                    <button
                      type="button"
                      onClick={() => { setActiveSection(prev => Math.max(0, prev - 1)); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                      className="px-6 py-2 bg-white hover:bg-slate-50 text-[#673ab7] border border-[#dadce0] rounded-[4px] font-medium text-[14px] shadow-[0_1px_1px_rgba(0,0,0,0.05)] transition-colors"
                    >
                      Kembali
                    </button>
                  )}

                  {currentSecIdx < totalSections - 1 ? (
                    <button
                      type="button"
                      onClick={() => { setActiveSection(prev => Math.min(totalSections - 1, prev + 1)); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                      className="px-6 py-2 bg-white hover:bg-purple-50/50 text-[#673ab7] border border-[#dadce0] rounded-[4px] font-medium text-[14px] shadow-[0_1px_1px_rgba(0,0,0,0.05)] transition-colors"
                    >
                      Berikutnya
                    </button>
                  ) : (
                    <button
                      type="button"
                      disabled={isLoading}
                      onClick={() => handleSubmitUjian(false)}
                      className="px-6 py-2 bg-[#673ab7] hover:bg-[#5e35b1] text-white rounded-[4px] font-medium text-[14px] shadow-[0_1px_2px_rgba(60,64,67,0.3)] transition-all disabled:opacity-50"
                    >
                      {isLoading ? 'Mengirim...' : 'Kirim'}
                    </button>
                  )}
                </div>

                {totalSections > 1 && (
                  <div className="flex items-center gap-3 flex-1 sm:max-w-[240px]">
                    <div className="flex-1 h-2.5 bg-[#dadce0] rounded-full overflow-hidden">
                      <div
                        className="h-full bg-[#1e8e3e] transition-all duration-300"
                        style={{ width: `${Math.round(((currentSecIdx + 1) / totalSections) * 100)}%` }}
                      ></div>
                    </div>
                    <span className="text-[14px] text-[#202124] font-normal whitespace-nowrap">
                      Halaman {currentSecIdx + 1} dari {totalSections}
                    </span>
                  </div>
                )}

                <button
                  type="button"
                  onClick={() => setShowClearConfirmModal(true)}
                  className="text-[14px] font-medium text-[#673ab7] hover:bg-purple-100/60 px-2 py-1.5 rounded-[4px] transition-colors"
                >
                  Kosongkan formulir
                </button>
              </div>
            </main>

            {/* MODAL KONFIRMASI KIRIM JAWABAN (IN-PAGE AGAR TIDAK MEMICU BLUR/ALARM) */}
            {showSubmitConfirmModal && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[120] px-5">
                <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl border-t-4 border-[#673ab7]">
                  <h3 className="text-lg font-extrabold text-slate-900 mb-2">Kirim Jawaban Ujian?</h3>
                  <p className="text-xs sm:text-sm text-slate-600 leading-relaxed mb-5">
                    Apakah Anda yakin ingin mengirim jawaban ujian sekarang? Jawaban akan direkam ke Google Form &amp; Server Sekolah dan Lockdown Mode akan dimatikan secara otomatis.
                  </p>
                  <div className="flex justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={() => setShowSubmitConfirmModal(false)}
                      className="px-4 py-2 rounded-lg text-xs sm:text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200"
                    >
                      Batal
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setShowSubmitConfirmModal(false);
                        handleSubmitUjian(false, true);
                      }}
                      className="px-5 py-2 rounded-lg text-xs sm:text-sm font-bold text-white bg-[#673ab7] hover:bg-[#5e35b1] shadow-md"
                    >
                      Ya, Kirim Jawaban
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL KONFIRMASI KOSONGKAN FORMULIR */}
            {showClearConfirmModal && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[120] px-5">
                <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl border-t-4 border-rose-500">
                  <h3 className="text-lg font-extrabold text-slate-900 mb-2">Kosongkan Formulir?</h3>
                  <p className="text-xs sm:text-sm text-slate-600 leading-relaxed mb-5">
                    Semua pilihan jawaban yang sudah Anda isi pada formulir ujian ini akan dihapus.
                  </p>
                  <div className="flex justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={() => setShowClearConfirmModal(false)}
                      className="px-4 py-2 rounded-lg text-xs sm:text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200"
                    >
                      Batal
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setJawaban({});
                        setShowClearConfirmModal(false);
                      }}
                      className="px-5 py-2 rounded-lg text-xs sm:text-sm font-bold text-white bg-rose-600 hover:bg-rose-700"
                    >
                      Ya, Kosongkan
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL POPUP: VIRTUAL SCRATCHPAD */}
            {showPad && (
              <div className="fixed bottom-16 right-4 w-80 h-96 bg-white border-2 border-[#673ab7] shadow-2xl rounded-2xl z-50 overflow-hidden flex flex-col">
                  <div className="p-3 bg-[#673ab7] text-white font-bold text-xs flex justify-between items-center flex-none">
                     <span className="flex items-center gap-1.5"><Palette size={14}/> Virtual Scratchpad</span>
                     <div className="flex gap-2">
                        <button onClick={clearCanvas} className="px-2 py-0.5 bg-purple-900 rounded hover:bg-purple-950 text-[10px]">Clear</button>
                        <button onClick={() => setShowPad(false)} className="text-white hover:text-rose-200 font-bold">X</button>
                     </div>
                  </div>
                  <div className="flex-1 bg-slate-50 relative overflow-hidden">
                     <canvas 
                        ref={canvasRef} 
                        width="320" 
                        height="380"
                        onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
                        onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}
                        className="w-full h-full cursor-crosshair touch-none"
                     />
                  </div>
              </div>
            )}

            {showTimeWarning ? (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[110] px-5">
                <div className="bg-white rounded-[2rem] w-full md:max-w-md p-6 md:p-8 text-center shadow-2xl border-4 border-rose-500">
                  <div className="w-16 h-16 md:w-20 md:h-20 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-4 md:mb-5"><AlertTriangle size={32} className="text-rose-600 md:w-10 md:h-10" /></div>
                  <h3 className="text-lg md:text-2xl font-black text-slate-800 mb-2">Peringatan Waktu!</h3>
                  <p className="text-slate-600 text-xs md:text-sm font-medium mb-6 md:mb-8 leading-relaxed">Waktu pengerjaan ujian Anda tersisa kurang dari <b className="text-rose-600 text-base">10 Menit</b>. Harap segera periksa kembali jawaban Anda.</p>
                  <button onClick={() => setShowTimeWarning(false)} className="w-full py-3 md:py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl md:rounded-2xl text-sm md:text-base transition-all shadow-lg shadow-rose-200">
                    Saya Mengerti, Kembali ke Soal
                  </button>
                </div>
              </div>
            ) : null}

            {isLoading && submitStatusText && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center modal-overlay p-6 text-center">
                <div className="w-16 h-16 border-4 border-purple-200 border-t-[#673ab7] rounded-full animate-spin mb-6"></div>
                <h3 className="text-white text-xl font-bold mb-2">Mengirim Jawaban Ujian...</h3>
                <p className="text-purple-200 max-w-md text-sm font-medium animate-pulse">{submitStatusText}</p>
                <div className="mt-8 p-4 bg-slate-900 border border-slate-800 rounded-2xl max-w-sm text-left">
                  <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">Status Keamanan</p>
                  <p className="text-xs text-slate-400 leading-relaxed font-semibold">Jawaban Anda direkam secara aman ke Google Form dan Spreadsheet Sekolah. Jangan tutup layar ini sampai proses selesai.</p>
                </div>
              </div>
            )}

          </div>
        );
      }

      if (view === 'selesai') {
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(err => console.log(err));
        }

        return (
          <div className="min-h-screen flex items-start justify-center bg-[#f0ebf8] px-3 pt-6 pb-16 relative overflow-hidden" style={{ fontFamily: "'Roboto', Arial, sans-serif" }}>
            <div className="bg-white rounded-lg border border-[#dadce0] w-full max-w-[640px] overflow-hidden relative z-10">
              <div className="h-[10px] bg-[#673ab7]"></div>
              <div className="px-6 py-6 text-left">
                <h1 className="text-[24px] sm:text-[32px] font-normal text-[#202124] mb-3 leading-tight">{(gformMeta && gformMeta.formTitle) ? gformMeta.formTitle : (appSettings.nama_ujian || 'Formulir Ujian')}</h1>
                <p className="text-[#202124] text-[14px] font-normal mb-5">Jawaban Anda telah direkam.</p>
                {offlineQueueCount > 0 ? (
                    <div className="p-3.5 bg-amber-50 rounded border border-amber-200 mb-4">
                        <p className="text-xs font-medium text-amber-800 flex items-center gap-1.5">
                            <RefreshCw size={14} className="animate-spin"/> Menyinkronkan {offlineQueueCount} antrean ke server...
                        </p>
                    </div>
                ) : (
                    <p className="text-xs font-medium text-[#1e8e3e] mb-4 flex items-center gap-1.5">
                        <CheckCircle size={15}/> Tersimpan ke Google Form &amp; Database Sekolah
                    </p>
                )}
                <p className="text-xs text-[#5f6368]">Anda dapat menutup halaman atau aplikasi ini sekarang.</p>
              </div>
            </div>
          </div>
        );
      }

      return null;
      };
      return (
        <div className="relative min-h-screen">
          {renderViewContent()}
          <Footer />
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
