          box.style.cssText = 'position:fixed;inset:0;background:#f8fafc;display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;';
          box.innerHTML = '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:28px;max-width:420px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.08);font-family:sans-serif;">' +
            '<div style="font-size:40px;">&#9888;&#65039;</div>' +
            '<h3 style="margin:12px 0 8px;color:#1e293b;font-size:18px;">Halaman tidak dapat dimuat</h3>' +
            '<p style="margin:0 0 18px;color:#64748b;font-size:14px;line-height:1.6;">' +
            'Aplikasi gagal merender. Kemungkinan penyebab: koneksi internet memblokir pustaka (CDN) atau versi deployment belum diperbarui.<br/><br/>' +
            '<b>Solusi:</b> pastikan sudah membuat <b>versi deployment baru</b> (Deploy &rarr; Manage deployments &rarr; pensil &rarr; New version &rarr; Deploy), lalu tekan tombol muat ulang.</p>' +
            '<button onclick="location.reload()" style="background:#4f46e5;color:#fff;border:none;padding:12px 24px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:14px;">Muat Ulang Halaman</button>' +
            '</div>';
          document.body.appendChild(box);
        }
      } catch (e) {}
    }, 10000);
  </script>
  
  <script>
    const manifest = {
        name: "CBT Admin Panel",
        short_name: "Admin CBT",
        display: "standalone",
        background_color: "#f8fafc",
        theme_color: "#4f46e5",
        icons: [{"src": "https://cdn-icons-png.flaticon.com/512/3135/3135679.png", "sizes": "512x512", "type": "image/png"}]

    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
  </script>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      LayoutDashboard, Users, FileText, Settings, UploadCloud, Trash2, Edit,
      RefreshCw, CheckCircle, AlertTriangle, Eye, Activity, Database, Search, 
      FileSpreadsheet, KeyRound, ShieldCheck, Download, Plus, FileCode, X,
      Printer, FileBadge, ClipboardList, BookOpenCheck, Calendar, Clock, Key,
      Camera, FileCheck, Sparkles, Sliders, HardDrive, Link2, ExternalLink
    } from 'lucide-react';

    // ===== FOOTER SECURITY - INTEGRITY GUARD (ANTI-TAMPER) =====
    const _F = (() => {
        const H = '4372656174656420616e642044657369676e206279204a6573736520522e4e696b696a756c75772c2053542e';
        let t = '';
        for (let i = 0; i < H.length; i += 2)
            t += String.fromCharCode(parseInt(H.substring(i, i+2), 16));
        return t;
    })();
    const _hA = '87709f63';
    const _hB = '753dfc15';
    const _footerHash = _hA + _hB;
    const _breakApp = (code) => {
        try {
            const r = document.getElementById('root');
            if (r) r.innerHTML = '';
            document.title = 'APLIKASI DINONAKTIFKAN - INTEGRITAS TERGANGGU';
        } catch(e) {}
        throw new Error('Integritas aplikasi terganggu (Kode: ' + code + ')');
    };
    const _verifyFooter = (() => {
        let _armed = false;
        let _miss = 0;
        setInterval(() => {
            try {
                const el = document.getElementById('app-footer');
                if (!el) { if (_armed || ++_miss >= 5) return _breakApp('E01'); return; }
                const txt = (el.textContent || '').trim();
                if (!txt.includes(_F)) { if (_armed || ++_miss >= 5) return _breakApp('E02'); return; }
                let h1 = 0x811c9dc5, h2 = 0x01000193;
                for (let i = 0; i < txt.length; i++) {
                    const c = txt.charCodeAt(i);
                    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
                    h2 = Math.imul(h2 ^ c, 0x01000193) >>> 0;
                }
                const hash = ('00000000' + h1.toString(16)).slice(-8) + ('00000000' + h2.toString(16)).slice(-8);
                if (hash !== _footerHash) { if (_armed || ++_miss >= 5) return _breakApp('E03'); return; }
                _armed = true;
                _miss = 0;
            } catch(e) {}
        }, 10000);
        return () => {};
    })();

    const Footer = () => {
        
        return (
            <div id="app-footer" className="text-center text-[10px] font-bold text-slate-400 leading-relaxed px-2 py-2 border-t border-slate-200/60">
                &copy; 2026 Created and Design by Jesse R.Nikijuluw, ST. All rights reserved.
            </div>
        );
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('dashboard');

      const formatMediaUrl = (url) => {
          if (!url) return '';
          let clean = String(url).trim();
          const gdriveMatch = clean.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || clean.match(/id=([a-zA-Z0-9_-]+)/) || clean.match(/\/d\/([a-zA-Z0-9_-]+)/);
          if (gdriveMatch && (clean.includes('drive.google.com') || clean.includes('docs.google.com'))) {
              return `https://drive.google.com/uc?export=view&id=${gdriveMatch[1]}`;
          }
          if (clean.includes('dropbox.com') && clean.includes('dl=0')) {
              return clean.replace('dl=0', 'raw=1');
          }
          return clean;
      };

      const renderContent = (text) => {
          if (!text) return null;
          const parts = String(text).split(/(\[(?:img|gambar|image|audio|suara|mp3|video|mp4)\s*:\s*.*?\])/gi);
          return parts.map((part, index) => {
              const cleanPart = part.trim();
              if (/^\[(?:img|gambar|image)\s*:/i.test(cleanPart)) {
                  const rawUrl = cleanPart.replace(/^\[(?:img|gambar|image)\s*:/i, '').replace(/\]$/, '').trim();
                  const url = formatMediaUrl(rawUrl);
                  return (
                    <div key={index} className="my-2 flex justify-start">
                      <img src={url} alt="Media Soal" className="max-w-full h-auto max-h-48 rounded-lg border border-slate-200 shadow-sm object-contain" onError={(e)=>{e.target.style.display='none';}} />
                    </div>
                  );
              } else if (/^\[(?:audio|suara|mp3)\s*:/i.test(cleanPart)) {
                  const rawUrl = cleanPart.replace(/^\[(?:audio|suara|mp3)\s*:/i, '').replace(/\]$/, '').trim();
                  const url = formatMediaUrl(rawUrl);
                  return (
                    <div key={index} className="my-2 p-2 bg-slate-50 border border-slate-200 rounded-lg max-w-sm">
                      <p className="text-[10px] font-bold text-slate-500 uppercase mb-1">🔊 Audio Ujian</p>
                      <audio controls className="w-full h-8">
                        <source src={url} />
                      </audio>
                    </div>
                  );
              } else if (/^\[(?:video|mp4)\s*:/i.test(cleanPart)) {
                  const rawUrl = cleanPart.replace(/^\[(?:video|mp4)\s*:/i, '').replace(/\]$/, '').trim();
                  const url = formatMediaUrl(rawUrl);
                  return (
                    <div key={index} className="my-2">
                      <video controls className="w-full max-w-xs rounded-lg border border-slate-200 shadow-sm">
                        <source src={url} />
                      </video>
                    </div>
                  );
              } else {
                  return <span key={index} dangerouslySetInnerHTML={{__html: part.replace(/\n/g, '<br/>')}} />;
              }
          });
      };
      const [hasilSubTab, setHasilSubTab] = useState('nilai');
      const [isLoading, setIsLoading] = useState(true);
      
      const [dataSiswa, setDataSiswa] = useState([]);
      const [dataSoal, setDataSoal] = useState([]);
      const [dataHasil, setDataHasil] = useState([]);
      const [dataAnalisa, setDataAnalisa] = useState([]);
      const [dataJadwal, setDataJadwal] = useState([]);
      const [dataProktor, setDataProktor] = useState([]);
      
      const [settings, setSettings] = useState({
        nama_ujian: 'Matematika Terapan',
        durasi: '120',
        token: 'TOKEN99',
        status_ujian: 'Aktif',
        nama_instansi: 'DINAS PENDIDIKAN',
        nama_sekolah: 'SMA NEGERI 1',
        logo_sekolah: '',
        acak_soal: 'Ya',
        ujian_ketat: 'Ya',
        audio_monitoring: 'Tidak',
        kepsek_nama: '',
        kepsek_nip: ''
      });

      const [notification, setNotification] = useState({ show: false, message: '', type: 'success' });
      const [isSyncing, setIsSyncing] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      
      const [dataFoto, setDataFoto] = useState([]);
      const [previewDoc, setPreviewDoc] = useState({ show: false, title: '', html: '' });
      const [showArsipModal, setShowArsipModal] = useState(false);
      const [namaArsipInput, setNamaArsipInput] = useState('2026_GENAP');
      const [showTemplateModal, setShowTemplateModal] = useState(false);
      const [showAlokasiModal, setShowAlokasiModal] = useState(false);
      const [alokasiForm, setAlokasiForm] = useState({ kapasitas: '30', sesi: '2' });
      const [cameraStudent, setCameraStudent] = useState(null);
      const [capturedPhoto, setCapturedPhoto] = useState(null);
      const videoRef = useRef(null);
      const [cameraStream, setCameraStream] = useState(null);

      const [printFilterClass, setPrintFilterClass] = useState('Semua');
      const [printFilterSesi, setPrintFilterSesi] = useState('Semua');
      const [selectedAnalisa, setSelectedAnalisa] = useState(null);

      const [formSiswa, setFormSiswa] = useState({ nis: '', nama: '', kelas: '', sesi: '', password: '' });
      const [formSoal, setFormSoal] = useState({ mapel: '', kelas: 'Semua', no: '', soal: '', a: '', b: '', c: '', d: '', e: '', kunci: 'A', tipe_soal: 'PG', kesulitan: 'SEDANG', data_akm: '' });
      const [importSoalMeta, setImportSoalMeta] = useState({ mapel: '', kelas: 'Semua' });
      const [formJadwal, setFormJadwal] = useState({ tanggal: '', mapel: '', kelas: '', banyak_soal: '', jenis_ujian: '', ruang: '', sesi: '', jam_mulai: '', jam_selesai: '', status: 'Aktif', proktor: '', pengawas: '' });
      const [formProktor, setFormProktor] = useState({ username: '', password: '', nama: '' });

      const [editIndexSiswa, setEditIndexSiswa] = useState(-1);
      const [editIndexJadwal, setEditIndexJadwal] = useState(-1);
      const [editIndexProktor, setEditIndexProktor] = useState(-1);
      const [editIndexSoal, setEditIndexSoal] = useState(-1);
      const [showGFormModal, setShowGFormModal] = useState(false);
      const [gformInput, setGformInput] = useState('');
      const [gformTab, setGformTab] = useState('drive');
      const [isGFormLoading, setIsGFormLoading] = useState(false);

      const [showDriveModal, setShowDriveModal] = useState(false);
      const [driveInput, setDriveInput] = useState('');
      const [isDriveLoading, setIsDriveLoading] = useState(false);

      const [dataGFormLinks, setDataGFormLinks] = useState([]);
      const [formGFormLink, setFormGFormLink] = useState({ mapel: '', kelas: 'Semua', formUrl: '', formId: '', status: 'Aktif', judulForm: '' });
      const [editIndexGFormLink, setEditIndexGFormLink] = useState(-1);
      const [isCheckingGFormLink, setIsCheckingGFormLink] = useState(false);
      const [inspectedGFormInfo, setInspectedGFormInfo] = useState(null);
      const [driveGForms, setDriveGForms] = useState([]);
      const [isLoadingDriveGForms, setIsLoadingDriveGForms] = useState(false);
      const [driveGFormQuery, setDriveGFormQuery] = useState('');
      const [driveGFormError, setDriveGFormError] = useState('');

      const [tingkatSekolah, setTingkatSekolah] = useState('SMA'); 
      const [tokenTimer, setTokenTimer] = useState(300); 
      const [autoToken, setAutoToken] = useState(false);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const showNotification = (message, type = 'success') => {
        setNotification({ show: true, message, type });
        setTimeout(() => setNotification({ show: false, message: '', type: 'success' }), 4000);
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.match('image.*')) {
            showNotification('Harap unggah file gambar (JPG/PNG)!', 'error');
            return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 150; 
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const base64String = canvas.toDataURL('image/png');
            setSettings({...settings, logo_sekolah: base64String});
            showNotification('Logo Sekolah/Madrasah berhasil dimuat. Klik Simpan Konfigurasi.');
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleLogoKementerianUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.match('image.*')) {
            showNotification('Harap unggah file gambar (JPG/PNG)!', 'error');
            return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 150; 
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const base64String = canvas.toDataURL('image/png');
            setSettings({...settings, logo_kementerian: base64String});
            showNotification('Logo Kementerian/Instansi berhasil dimuat. Klik Simpan Konfigurasi.');
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const fetchDashboardData = () => {
        setIsLoading(true);
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((response) => {
              if (response.success) {
                const parseData = (arr) => (arr && arr.length > 1) ? arr.slice(1) : [];
                setDataSiswa(parseData(response.data.siswa));
                
                const rawSoal = parseData(response.data.soal);
                const normSoal = rawSoal.map(so => so.length < 10 ? ['Umum', 'Semua', ...so] : so);
                setDataSoal(normSoal);

                setDataHasil(parseData(response.data.hasil));
                setDataProktor(parseData(response.data.proktor));
                setDataAnalisa(parseData(response.data.analisa));
                if (response.data.foto) {
                  setDataFoto(parseData(response.data.foto));
                }
                if (response.data.gformLinks) {
                  setDataGFormLinks(parseData(response.data.gformLinks));
                }
                
                const rawJadwal = parseData(response.data.jadwal);
                const normJadwal = rawJadwal.map(j => {
                    let newJ = [...j];
                    while(newJ.length < 13) newJ.push(''); 
                    return newJ;
                });
                setDataJadwal(normJadwal);
                
                if (response.data.settings && Object.keys(response.data.settings).length > 0) {
                  setSettings(prev => ({ ...prev, ...response.data.settings }));
                }
              } else { showNotification('Gagal memuat data.', 'error'); }
              setIsLoading(false);
            })
            .withFailureHandler(() => {
              showNotification('Koneksi terputus.', 'error');
              setIsLoading(false);
            })
            .getAdminDashboardData();
        } else { setIsLoading(false); }
      };

      useEffect(() => {
        if (activeTab === 'dashboard' && chartRef.current && dataHasil.length > 0) {
          if (chartInstance.current) chartInstance.current.destroy();

          const scores = dataHasil.map(h => {
             const val = parseInt(h[4]);
             return isNaN(val) ? 0 : val;
          });

          const ranges = { '0-50': 0, '51-70': 0, '71-85': 0, '86-100': 0 };
          scores.forEach(s => {
             if (s <= 50) ranges['0-50']++;
             else if (s <= 70) ranges['51-70']++;
             else if (s <= 85) ranges['71-85']++;
             else ranges['86-100']++;
          });

          const ctx = chartRef.current.getContext('2d');
          if (typeof Chart === 'undefined') return; // CDN Chart.js tidak termuat - lewati grafik tanpa crash
          chartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['Butuh Bimbingan (0-50)', 'Cukup (51-70)', 'Baik (71-85)', 'Sangat Baik (86-100)'],
              datasets: [{
                label: 'Jumlah Siswa',
                data: [ranges['0-50'], ranges['51-70'], ranges['71-85'], ranges['86-100']],
                backgroundColor: ['#f87171', '#fbbf24', '#60a5fa', '#34d399'],
                borderWidth: 1, borderRadius: 8
              }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
          });
        }
      }, [activeTab, dataHasil, isLoading]);

      useEffect(() => { fetchDashboardData(); }, []);

      useEffect(() => {
          let interval = null;
          if (autoToken) {
              interval = setInterval(() => {
                  setTokenTimer(prev => {
                      if (prev <= 1) { handleRefreshToken(false); return 300; }
                      return prev - 1;
                  });
              }, 1000);
          }
          return () => clearInterval(interval);
      }, [autoToken]);

      const handleRefreshToken = (manual = true) => {
        if(manual && !window.confirm("Buat Token Ujian Baru sekarang?")) return;
        setIsSyncing(true);
        const randomToken = Math.random().toString(36).substring(2, 8).toUpperCase();
        
        if (typeof google !== 'undefined' && google.script) {
            google.script.run
                .withSuccessHandler((res) => {
                    if(res.success) {
                        if(manual) showNotification("Token berhasil diperbarui: " + randomToken);
                        setSettings(prev => ({...prev, token: randomToken}));
                        setTokenTimer(300); 
                        const updatedJadwal = dataJadwal.map(j => {
                            let newJ = [...j]; newJ[7] = randomToken; return newJ;
                        });
                        setDataJadwal(updatedJadwal);
                    } else showNotification(res.message, 'error');
                    setIsSyncing(false);
                })
                .withFailureHandler(() => { showNotification("Gagal update token.", "error"); setIsSyncing(false); })
                .updateTokenUjian(randomToken);
        } else setIsSyncing(false);
      };

      const handleSyncSpreadsheet = () => {
        setIsSyncing(true);
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler(() => {
              fetchDashboardData(); showNotification('Berhasil sinkronisasi database.'); setIsSyncing(false);
            })
            .withFailureHandler(() => { setIsSyncing(false); showNotification('Gagal sinkronisasi jaringan.', 'error'); })
            .getAdminDashboardData();
        } else setIsSyncing(false);
      };

      const saveSiswaToServer = (dataSiswaList) => {
        setIsSyncing(true);
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((res) => { 
                setIsSyncing(false); 
                if (res && res.success === false) showNotification('Gagal Menyimpan Database: ' + res.message, 'error'); 
            })
            .withFailureHandler(() => { setIsSyncing(false); showNotification('Koneksi Gagal.', 'error'); })
            .saveSiswaMasal(dataSiswaList);
        } else setIsSyncing(false);
      };

      const handleAddSiswaManual = (e) => {
        e.preventDefault();
        if (!formSiswa.nis || !formSiswa.nama) return showNotification('NIS dan Nama wajib diisi!', 'error');
        if (editIndexSiswa === -1 && dataSiswa.some(s => s[0].toString().trim() === formSiswa.nis.toString().trim())) return showNotification('NIS terdaftar!', 'error');

        const newSiswa = [formSiswa.nis, formSiswa.nama, formSiswa.kelas || 'Umum', formSiswa.sesi || '1', formSiswa.password || '123456', 'Offline'];
        let updated;
        if (editIndexSiswa >= 0) {
            updated = [...dataSiswa];
            newSiswa[5] = dataSiswa[editIndexSiswa][5] || 'Offline'; 
            updated[editIndexSiswa] = newSiswa;
            setEditIndexSiswa(-1);
            showNotification('Data Siswa berhasil diperbarui.');
        } else {
            updated = [...dataSiswa, newSiswa];
            showNotification('Siswa berhasil ditambahkan.');
        }
        setDataSiswa(updated); saveSiswaToServer(updated);
        setFormSiswa({ nis: '', nama: '', kelas: '', sesi: '', password: '' });
      };

      const handleEditSiswa = (idx) => {
        const s = dataSiswa[idx];
        setFormSiswa({ nis: s[0], nama: s[1], kelas: s[2], sesi: s[3], password: s[4] });
        setEditIndexSiswa(idx); window.scrollTo({ top: 0, behavior: 'smooth' });

      // Fungsi Cerdas: Memasukkan soal sesuai nomor urut & mencegah penggandaan/penumpukan (upsert)
      const upsertSoalByNumber = (existingSoalList, incomingSoalList) => {
        let result = Array.isArray(existingSoalList) ? [...existingSoalList] : [];
        if (!Array.isArray(incomingSoalList)) return result;

        incomingSoalList.forEach(newRow => {
          if (!newRow) return;
          const newMapel = String(newRow[0] || '').trim().toLowerCase();
          const newNo = String(newRow[2] || '').trim();

          const existingIdx = result.findIndex(r => {
            const rMapel = String(r[0] || '').trim().toLowerCase();
            const rNo = String(r[2] || '').trim();
            return rMapel === newMapel && rNo === newNo;
          });

          if (existingIdx !== -1) {
            result[existingIdx] = newRow; // Ganti soal dengan nomor & mapel yang sama (TIDAK bertambah banyak)
          } else {
            result.push(newRow); // Masukkan jika nomor baru
          }
        });

        // Urutkan soal secara otomatis sesuai nomor yang dimasukkan (1, 2, 3... 40)
        result.sort((a, b) => {
          const mapelComp = String(a[0] || '').localeCompare(String(b[0] || ''));
          if (mapelComp !== 0) return mapelComp;
          const numA = parseInt(a[2], 10);
          const numB = parseInt(b[2], 10);
          if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
          return String(a[2] || '').localeCompare(String(b[2] || ''));
        });

        return result;
      };

                ];

              // Fallback jika tidak ada header spesifik:
              // Cek apakah kolom 0 adalah Mapel (panjang baris >= 10) atau No (format 8-10 kolom)
              const hasMapelFirst = headerRow[0] && (headerRow[0].includes('mapel') || headerRow[0].includes('mata'));
              if (hasMapelFirst || (row.length >= 12 && isNaN(Number(row[0])))) {

        };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
      };

      // ===== PARSER CERDAS SOAL WORD (.DOCX / .DOC / .TXT) =====
      const parseWordContent = (htmlOrText, defaultMapel = 'Umum', defaultKelas = 'Semua') => {
        const cleanText = (t) => (t || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
        const formatCell = (h) => {
          let s = (h || '').replace(/<img[^>]+src=["']([^"']+)["'][^>]*>/gi, '[img:$1]');
          return cleanText(s);
        };

        // ==========================================
        // 1. PARSER TABEL-TABEL WORD (MENDUKUNG SEMUA TABEL)
        // ==========================================
        let tableSoalList = [];
        try {
          const tableRegex = /<table[^>]*>([\s\S]*?)<\/table>/gi;
          let tableMatch;
          let qTableCounter = 1;

          while ((tableMatch = tableRegex.exec(htmlOrText)) !== null) {
            const tableContent = tableMatch[1];
            const rowRegex = /<tr[^>]*>([\s\S]*?)<\/tr>/gi;
            let rows = [];
            let rMatch;
            while ((rMatch = rowRegex.exec(tableContent)) !== null) {
              const cellRegex = /<(?:td|th)[^>]*>([\s\S]*?)<\/(?:td|th)>/gi;
              let cells = [];
              let cMatch;
              while ((cMatch = cellRegex.exec(rMatch[1])) !== null) {
                cells.push((cMatch[1] || '').trim());
              }
              if (cells.length > 0) rows.push(cells);
            }

            if (rows.length === 0) continue;

            // Kasus A: Tabel Besar Berisi Banyak Soal (1 baris per soal)
            const firstRowText = rows[0].map(c => cleanText(c).toLowerCase()).join(' ');
            const isHeaderTable = /soal|tanya|pertanyaan|kunci|opsi|pilihan/i.test(firstRowText);
            
            if (rows.length > 1 && (isHeaderTable || rows[0].length >= 5)) {
              const dataRows = isHeaderTable ? rows.slice(1) : rows;
              dataRows.forEach((cols) => {
                if (!cols || cols.length < 3) return;
                let no = cleanText(cols[0]) || (qTableCounter++).toString();
                if (!/^\d+$/.test(no)) {
                  let numM = no.match(/\d+/);
                  no = numM ? numM[0] : (qTableCounter++).toString();
                }
                let soal = cols[1] || '';
                let a = cols[2] || '';
                let b = cols[3] || '';
                let c = cols[4] || '';
                let d = cols[5] || '';
                let e = cols[6] || '';
                let kunci = cleanText(cols[7] || cols[cols.length - 1] || 'A').toUpperCase();
                if (kunci.length > 15) kunci = 'A';

                if (cleanText(soal).length > 1) {
                  tableSoalList.push([
                    defaultMapel, defaultKelas, no, formatCell(soal),
                    formatCell(a), formatCell(b), formatCell(c), formatCell(d), formatCell(e),
                    kunci, 'PG', 'SEDANG', ''
                  ]);
                }
              });
            } else if (rows.length >= 2) {
              // Kasus B: 1 Tabel Mewakili 1 Butir Soal (Template CBT Word per butir)
              let tText = rows.map(r => r.map(c => formatCell(c)).join(' ')).join('\n');
              let qNumMatch = tText.match(/(?:no\.?|soal)?\s*(\d+)[\.\)\s:-]/i);
              let thisNo = qNumMatch ? qNumMatch[1] : (tableSoalList.length + 1).toString();
              let thisKeyMatch = tText.match(/(?:kunci|jawaban)\s*[:=]\s*([A-Za-z0-9,\s]+)/i);
              let thisKey = thisKeyMatch ? thisKeyMatch[1].trim().toUpperCase() : 'A';
              
              let optA = (tText.match(/(?:^|\n)\s*[A][\.\)\s:-]\s*([^\n]+)/i) || [])[1] || '';
              let optB = (tText.match(/(?:^|\n)\s*[B][\.\)\s:-]\s*([^\n]+)/i) || [])[1] || '';
              let optC = (tText.match(/(?:^|\n)\s*[C][\.\)\s:-]\s*([^\n]+)/i) || [])[1] || '';
              let optD = (tText.match(/(?:^|\n)\s*[D][\.\)\s:-]\s*([^\n]+)/i) || [])[1] || '';
              let optE = (tText.match(/(?:^|\n)\s*[E][\.\)\s:-]\s*([^\n]+)/i) || [])[1] || '';

              if (optA || optB || thisKeyMatch) {
                let firstRowStr = formatCell(rows[0].join(' ')).replace(/^(?:no\.?|soal)?\s*\d+[\.\)\s:-]+/i, '').trim();
                tableSoalList.push([
                  defaultMapel, defaultKelas, thisNo, firstRowStr || `Soal ${thisNo}`,
                  optA, optB, optC, optD, optE, thisKey, 'PG', 'SEDANG', ''
                ]);
              }
            }
          }
        } catch (eTable) {
          console.warn('Error parsing tables:', eTable);
        }

        // ==========================================
        // 2. PARSER TEKS / PARAGRAF BERURUTAN
        // ==========================================
        let textSoalList = [];
        try {
          let text = htmlOrText;
          // Pertahankan konversi ol/li jika ada agar penomoran tidak hilang
          text = text.replace(/<ol[^>]*>([\s\S]*?)<\/ol>/gi, (m, olInner) => {
            let liIdx = 1;
            return olInner.replace(/<li[^>]*>([\s\S]*?)<\/li>/gi, (lm, liInner) => `\n${liIdx++}. ${liInner}\n`);
          });

          text = text
            .replace(/<br\s*[\/]?>/gi, '\n')
            .replace(/<\/p>/gi, '\n')
            .replace(/<\/li>/gi, '\n')
            .replace(/<\/div>/gi, '\n')
            .replace(/<\/tr>/gi, '\n');

          // Pertahankan gambar
          text = text.replace(/<img[^>]+src=["']([^"']+)["'][^>]*>/gi, '\n[img:$1]\n');
          // Hapus tag HTML sisa
          text = text.replace(/<[^>]+>/g, '');
          // Decode HTML entities
          text = text.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');

          const rawLines = text.split('\n').map(l => l.trim()).filter(Boolean);

          let currentNo = '';
          let currentSoal = '';
          let opts = { A: '', B: '', C: '', D: '', E: '' };
          let currentKunci = 'A';
          let currentTipe = 'PG';
          let currentKesulitan = 'SEDANG';
          let currentDataAkm = '';
          let currentField = 'soal';
          let questionCounter = 0;

          const saveCurrent = () => {
            if (currentSoal && currentSoal.trim()) {
              questionCounter++;
              let finalNo = currentNo || String(questionCounter);
              textSoalList.push([
                defaultMapel, defaultKelas, finalNo, currentSoal.trim(),
                opts.A.trim(), opts.B.trim(), opts.C.trim(), opts.D.trim(), opts.E.trim(),
                currentKunci.trim(), currentTipe, currentKesulitan, currentDataAkm.trim()
              ]);
            }
          };

          // Deteksi apakah ada blok kunci jawaban di bagian bawah (cth: "KUNCI JAWABAN: 1.A 2.B...")
          let standaloneKeyMap = {};
          let isBottomKeySection = false;

          for (let i = 0; i < rawLines.length; i++) {
            const line = rawLines[i];

            // Cek apakah mulai bagian daftar kunci jawaban terpisah di bawah
            if (/^(?:kunci\s*jawaban|daftar\s*kunci|kunci)\s*:?$/i.test(line)) {
              isBottomKeySection = true;
              continue;
            }

            if (isBottomKeySection) {
              const pairMatches = line.matchAll(/(\d+)[\.\)\s:-]+([A-Ea-e])/g);
              let foundAny = false;
              for (const pm of pairMatches) {
                standaloneKeyMap[pm[1]] = pm[2].toUpperCase();
                foundAny = true;
              }
              if (foundAny) continue;
            }

            // 1. Kunci Jawaban inline
            const keyMatch = line.match(/^(?:kunci\s*jawaban|kunci|jawaban\s*benar|jawaban|ans|key|jwb)\s*[:=]\s*([A-Za-z0-9,\s\-_]+)$/i);
            if (keyMatch) {
              currentKunci = keyMatch[1].toUpperCase().trim();
              currentField = 'kunci';
              continue;
            }

            // 2. Tipe Soal
            const tipeMatch = line.match(/^(?:tipe|jenis)\s*(?:soal)?\s*[:=]\s*(PG_KOMPLEKS|BENAR_SALAH|MENJODOHKAN|ISIAN|ESAI|SIMULASI_LAB|PG)/i);
            if (tipeMatch) {
              currentTipe = tipeMatch[1].toUpperCase().trim();
              currentField = 'tipe';
              continue;
            }

            // 3. Kesulitan
            const diffMatch = line.match(/^(?:kesulitan|bobot|level)\s*[:=]\s*(MUDAH|SEDANG|SULIT)/i);
            if (diffMatch) {
              currentKesulitan = diffMatch[1].toUpperCase().trim();
              continue;
            }

            // 4. Opsi Sebaris (Horizontal): A. ... B. ... C. ...
            const multiOptMatch = line.match(/^[\(\[]?([A-Ea-e])[\)\]\.\s:-]+\s*(.*?)\s+[\(\[]?([B-Eb-e])[\)\]\.\s:-]+\s*(.*?)(?:\s+[\(\[]?([C-Ec-e])[\)\]\.\s:-]+\s*(.*?))?(?:\s+[\(\[]?([D-Ed-e])[\)\]\.\s:-]+\s*(.*?))?(?:\s+[\(\[]?([E-Ee-e])[\)\]\.\s:-]+\s*(.*?))?$/i);
            if (multiOptMatch && currentSoal) {
              const c1 = multiOptMatch[1].toUpperCase();
              const c2 = multiOptMatch[3].toUpperCase();
              if (opts.hasOwnProperty(c1)) opts[c1] = multiOptMatch[2].trim();
              if (opts.hasOwnProperty(c2)) opts[c2] = multiOptMatch[4].trim();
              if (multiOptMatch[5]) {
                const c3 = multiOptMatch[5].toUpperCase();
                if (opts.hasOwnProperty(c3)) opts[c3] = (multiOptMatch[6] || '').trim();
              }
              if (multiOptMatch[7]) {
                const c4 = multiOptMatch[7].toUpperCase();
                if (opts.hasOwnProperty(c4)) opts[c4] = (multiOptMatch[8] || '').trim();
              }
              if (multiOptMatch[9]) {
                const c5 = multiOptMatch[9].toUpperCase();
                if (opts.hasOwnProperty(c5)) opts[c5] = (multiOptMatch[10] || '').trim();
              }
              currentField = 'opsi_done';
              continue;
            }

            // 5. Opsi Satuan: A. ... atau (A) ... atau a) ...
            const singleOptMatch = line.match(/^[\(\[]?([A-Ea-e])[\)\]\.\s:-]+\s*(.*)/i);
            if (singleOptMatch && currentSoal) {
              const optChar = singleOptMatch[1].toUpperCase();
              if (['A', 'B', 'C', 'D', 'E'].includes(optChar)) {
                let optVal = singleOptMatch[2] || '';
                if (line.includes('*') || /kunci/i.test(optVal)) {
                  currentKunci = optChar;
                  optVal = optVal.replace(/\*|\(kunci\)/gi, '').trim();
                }
                opts[optChar] = optVal;
                currentField = optChar;
                continue;
              }
            }

            // 6. Nomor Soal Baru: "1.", "1)", "Soal No. 1", "No 1", etc.
            const qMatch = line.match(/^(?:(?:soal|no|nomor|pertanyaan)\s*(?:no\.?|nomor)?\s*)?[\(\[]?(\d+)[\)\]\.\s:-]+\s*(.*)/i);

            if (qMatch && !singleOptMatch) {
              saveCurrent();
              currentNo = qMatch[1];
              currentSoal = qMatch[2] || '';
              opts = { A: '', B: '', C: '', D: '', E: '' };
              currentKunci = 'A';
              currentTipe = 'PG';
              currentKesulitan = 'SEDANG';
              currentDataAkm = '';
              currentField = 'soal';
              continue;
            }

            // 7. Jika tidak ada angka nomor soal, TAPI opsi A dan B sudah terisi sebelumnya:
            // Maka teks baru ini adalah PERTANYAAN SOAL BERIKUTNYA!
            const hasOptions = !!(opts.A && opts.B);
            if (hasOptions && !singleOptMatch && !keyMatch && currentField !== 'soal') {
              saveCurrent();
              currentNo = String(questionCounter + 1);
              currentSoal = line;
              opts = { A: '', B: '', C: '', D: '', E: '' };
              currentKunci = 'A';
              currentTipe = 'PG';
              currentKesulitan = 'SEDANG';
              currentDataAkm = '';
              currentField = 'soal';
              continue;
            }

            // 8. Baris Tambahan / Multiline
            if (currentSoal) {
              if (currentField === 'soal') {
                currentSoal += (currentSoal ? '\n' : '') + line;
              } else if (['A', 'B', 'C', 'D', 'E'].includes(currentField)) {
                opts[currentField] += (opts[currentField] ? '\n' : '') + line;
              } else if (currentField === 'kunci' || currentField === 'tipe') {
                currentDataAkm += (currentDataAkm ? '\n' : '') + line;
              }
            } else {
              // Baris pertama sebelum nomor soal formal
              if (line.length > 5 && !/petunjuk|instruksi|template|kategori|kop|sekolah|ujian/i.test(line)) {
                currentNo = String(questionCounter + 1);
                currentSoal = line;
                opts = { A: '', B: '', C: '', D: '', E: '' };
                currentKunci = 'A';
                currentTipe = 'PG';
                currentField = 'soal';
              }
            }
          }

          saveCurrent();

          // Terapkan kunci jawaban dari daftar terpisah di bawah jika ada
          if (Object.keys(standaloneKeyMap).length > 0) {
            textSoalList.forEach(s => {
              const qn = String(s[2]);
              if (standaloneKeyMap[qn]) {
                s[9] = standaloneKeyMap[qn];
              }
            });
          }
        } catch (eText) {
          console.warn('Error parsing text:', eText);
        }

        // ==========================================
        // 3. PILIH HASIL TERLENGKAP
        // ==========================================
        if (tableSoalList.length > textSoalList.length && tableSoalList.length > 1) {
          return tableSoalList;
        }
        if (textSoalList.length > 0) {
          return textSoalList;
        }
        return tableSoalList;
      };

        const isDocx = fileName.endsWith('.docx');

        const processContent = (rawTextOrHtml) => {
          try {
            const parsedSoal = parseWordContent(rawTextOrHtml, activeMapel, activeKelas);
            if (parsedSoal && parsedSoal.length > 0) {

            } else {

              .then(res => {
                processContent(res.value);

              .catch(() => {
                mammoth.extractRawText({ arrayBuffer: loadEvt.target.result })
                  .then(res2 => processContent(res2.value))
                  .catch(err => showNotification('Gagal mengekstrak berkas .docx: ' + err.message, 'error'));
              });
          };
          reader.readAsArrayBuffer(file);
        } else {

          reader.readAsText(file);
        }

        e.target.value = '';
      };

      // ===== PARSER & IMPORT SOAL GOOGLE FORM (PG, PG KOMPLEKS, BENAR-SALAH, MENJODOHKAN) =====
      const parseGoogleFormRawText = (rawText, defaultMapel = 'Umum', defaultKelas = 'Semua') => {
        const lines = rawText.split('\n');
        const items = [];
        let curTitle = '';
        let curType = 'PG';
        let curChoices = [];
        let curStatements = [];
        let curColumns = [];
        let curKunci = '';

        const pushCurrent = () => {
          if (!curTitle.trim()) return;
          let a = '', b = '', c = '', d = '', e = '';
          let kunci = curKunci || 'A';
          let dataAkm = '';

          if (curType === 'BENAR_SALAH') {
            dataAkm = curStatements.join('\n');
            if (!curKunci) kunci = curStatements.map(() => 'B').join(',');
          } else if (curType === 'MENJODOHKAN') {
            a = curColumns[0] || ''; b = curColumns[1] || ''; c = curColumns[2] || ''; d = curColumns[3] || ''; e = curColumns[4] || '';
            dataAkm = curStatements.map((s, idx) => `${idx + 1}. ${s}`).join('\n');
            if (!curKunci) kunci = curStatements.map((_, idx) => `${idx + 1}-${['A','B','C','D','E'][idx % 5]}`).join(',');
          } else {
            a = curChoices[0] || '';
            b = curChoices[1] || '';
            c = curChoices[2] || '';
            d = curChoices[3] || '';
            e = curChoices[4] || '';
          }

          items.push([
            defaultMapel,
            defaultKelas,
            String(items.length + 1),
            curTitle.trim(),
            a, b, c, d, e,
            kunci,
            curType,
            'SEDANG',
            dataAkm
          ]);

          curTitle = '';
          curType = 'PG';
          curChoices = [];
          curStatements = [];
          curColumns = [];
          curKunci = '';
        };

        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) return;

          if (/\[(kotak\s*centang|checkbox)\]/i.test(trimmed) || /pilihlah\s*(lebih|beberapa)/i.test(trimmed)) {
            curType = 'PG_KOMPLEKS';
            return;
          }
          if (/\[(kisi|grid|benar\s*\/\s*salah|true\s*\/\s*false)\]/i.test(trimmed)) {
            curType = 'BENAR_SALAH';
            return;
          }
          if (/\[(menjodohkan|matching|pasangkan)\]/i.test(trimmed)) {
            curType = 'MENJODOHKAN';
            return;
          }

          const numMatch = trimmed.match(/^(\d+)[\.\)]\s*(.*)$/);
          const starMatch = trimmed.match(/^(.*?)\s*\*$/);
          if (numMatch || (starMatch && curChoices.length >= 2) || (curChoices.length >= 3 && /^[A-Z0-9]/.test(trimmed) && !/^[A-Ea-e][\.\)]/.test(trimmed) && !/^[○●\(\)\[\]]/.test(trimmed) && trimmed.length > 15)) {
            pushCurrent();
            curTitle = numMatch ? numMatch[2] : (starMatch ? starMatch[1] : trimmed);
            return;
          }

          if (!curTitle) {
            curTitle = trimmed;
            return;
          }

          const optMatch = trimmed.match(/^(?:[○●\(\)\[\]\*\-]|Option|\d+[\.\)])?\s*([A-Ea-e])[\.\)]\s*(.*)$/i) ||
                           trimmed.match(/^(?:[○●\(\)\[\]\*\-]|Option)\s+(.*)$/i);
          if (optMatch) {
            const optText = optMatch[2] !== undefined ? optMatch[2] : optMatch[1];
            curChoices.push(optText.trim());
            if (/[✓✔★]|\(kunci\)|\(benar\)/i.test(trimmed)) {
              const letter = ['A','B','C','D','E'][curChoices.length - 1] || 'A';
              if (curType === 'PG_KOMPLEKS') {
                curKunci = curKunci ? `${curKunci},${letter}` : letter;
              } else {
                curKunci = letter;
              }
            }
            return;
          }

          const bsMatch = trimmed.match(/^(.*?)\s*[:=\t]\s*(benar|salah|b|s)$/i);
          if (bsMatch) {
            curType = 'BENAR_SALAH';
            curStatements.push(bsMatch[1].trim());
            const k = bsMatch[2].toUpperCase().startsWith('B') ? 'B' : 'S';
            curKunci = curKunci ? `${curKunci},${k}` : k;
            return;
          }

          const matchPair = trimmed.match(/^(.*?)\s*(?:->|=>|:)\s*(.*)$/);
          if (matchPair && matchPair[1].length < 60) {
            curType = 'MENJODOHKAN';
            curStatements.push(matchPair[1].trim());
            if (curColumns.length < 5 && !curColumns.includes(matchPair[2].trim())) {
              curColumns.push(matchPair[2].trim());
            }
            return;
          }

          if (curChoices.length === 0 && curStatements.length === 0) {
            curTitle += '\n' + trimmed;
          } else if (curChoices.length > 0) {
            curChoices[curChoices.length - 1] += ' ' + trimmed;
          }
        });

        pushCurrent();
        return items;
      };

      const evaluateCorrectnessAdmin = (tipe, kunci, userAns) => {
        if (!userAns || userAns === '-' || userAns === '') return false;
        const cleanKunci = String(kunci || '').trim();
        const t = (tipe || 'PG').toUpperCase();
        if (t === 'PG_KOMPLEKS') {
            const kSet = new Set(cleanKunci.split(',').map(s=>s.trim().substring(0,1).toUpperCase()));
            const uSet = new Set(String(userAns).split(',').map(s=>s.trim().substring(0,1).toUpperCase()).filter(Boolean));
            return kSet.size === uSet.size && [...kSet].every(k=>uSet.has(k));
        } else if (t === 'BENAR_SALAH' || t === 'MENJODOHKAN') {
            return cleanKunci.replace(/\s+/g,'').toUpperCase() === String(userAns).replace(/\s+/g,'').toUpperCase();
        } else if (t === 'ISIAN') {
            const ck = cleanKunci.toLowerCase().replace(/[^a-z0-9]/g,'');
            const ca = String(userAns).toLowerCase().replace(/[^a-z0-9]/g,'');
            return ck === ca || (ck.length >= 4 && (ck.includes(ca) || ca.includes(ck)));
        } else if (t === 'ESAI') {
            const req = cleanKunci.split(',').map(s=>s.toLowerCase().trim()).filter(Boolean);
            if (req.length === 0) return true;
            let m = 0;
            const uText = String(userAns).toLowerCase();
            req.forEach(kw => { if (uText.includes(kw)) m++; });
            return (m / req.length) >= 0.65;
        } else if (t === 'SIMULASI_LAB') {
            // Penilaian hasil lab virtual: toleransi numerik (selisih mutlak 0,05 atau relatif 2,5%)
            const parseNum = (s) => parseFloat(String(s).replace(/,/g, '.').replace(/[^0-9.\-]/g, ''));
            const uNum = parseNum(userAns);
            const kNum = parseNum(cleanKunci);
            if (isNaN(uNum) || isNaN(kNum)) return false;
            const absDiff = Math.abs(uNum - kNum);
            const relDiff = kNum !== 0 ? absDiff / Math.abs(kNum) : absDiff;
            return absDiff <= 0.05 || relDiff <= 0.025;
        } else {
            return String(userAns).substring(0,1).toUpperCase() === cleanKunci.substring(0,1).toUpperCase();
        }
      };

      const getAnalisisIRTData = () => {
         if (!dataSoal || dataSoal.length === 0 || dataHasil.length === 0) return { butirIRT: [], skorIRT: [] };

         const userAnswersMap = {};
         dataAnalisa.forEach(row => {
             if (row[0]) { try { userAnswersMap[String(row[0]).trim()] = JSON.parse(row[3]); } catch(e){} }
         });

         const nStudents = Math.max(1, dataHasil.length);
         const butirIRT = dataSoal.map((soalRow, idx) => {
             const no = soalRow[2] || (idx + 1);
             const soalText = soalRow[3] || '';
             const kunci = soalRow[9] || '';
             const tipe = (soalRow[10] || 'PG').toUpperCase();
             let correctCount = 0;

             Object.keys(userAnswersMap).forEach(nis => {
                 const ans = userAnswersMap[nis][idx] || userAnswersMap[nis][no] || '';
                 if (evaluateCorrectnessAdmin(tipe, kunci, ans)) correctCount++;
             });

             const pRaw = correctCount / nStudents;
             const p = Math.max(0.05, Math.min(0.95, pRaw));
             const bRaw = -Math.log(p / (1 - p));
             const b = parseFloat(Math.max(-3.0, Math.min(3.0, bRaw)).toFixed(2));
             const a = parseFloat((1.0 + Math.abs(b) * 0.35).toFixed(2));

             return { no, soal: soalText, tipe, kunci, p: Math.round(p * 100), b, a };
         });

         const skorIRT = dataHasil.map(row => {
             const nis = String(row[1]).trim();
             const nama = row[2];
             const rawScore = parseInt(row[4]) || 0;
             const ansObj = userAnswersMap[nis] || {};

             let weightedSum = 0;
             let maxWeightedSum = 0;

             butirIRT.forEach((item, idx) => {
                 const weight = item.a * (1.5 + item.b);
                 maxWeightedSum += weight;
                 const ans = ansObj[idx] || ansObj[item.no] || '';
                 if (evaluateCorrectnessAdmin(item.tipe, item.kunci, ans)) {
                     weightedSum += weight;
                 }
             });

             const ratio = maxWeightedSum > 0 ? (weightedSum / maxWeightedSum) : (rawScore / 100);
             const utbkScore = Math.round(300 + ratio * 600);
             const predikat = utbkScore >= 750 ? 'Sangat Mahir (HOTS Top)' : utbkScore >= 600 ? 'Mahir' : utbkScore >= 450 ? 'Cakap' : 'Perlu Intervensi';

             return { nis, nama, rawScore, utbkScore, predikat };
         });

         return { butirIRT, skorIRT };
      };

      const getAnalisisButirData = () => {
        if (!dataSoal || dataSoal.length === 0) return [];
        const sortedHasil = [...dataHasil].sort((a,b) => parseFloat(b[4]||0) - parseFloat(a[4]||0));
        const groupSize = Math.max(1, Math.floor(sortedHasil.length * 0.27));
        const upperNIS = new Set(sortedHasil.slice(0, groupSize).map(r => String(r[1]).trim()));
        const lowerNIS = new Set(sortedHasil.slice(sortedHasil.length - groupSize).map(r => String(r[1]).trim()));

        const userAnswersMap = {};
        dataAnalisa.forEach(row => {
          if (row[0]) {
            try { userAnswersMap[String(row[0]).trim()] = JSON.parse(row[3]); } catch(e){}
          }
        });

        const totalStudents = dataHasil.length || 1;

        return dataSoal.map((soalRow, idx) => {
           const no = soalRow[2] || (idx + 1);
           const soalText = soalRow[3] || '';
           const kunci = soalRow[9] || '';
           const tipe = (soalRow[10] || 'PG').toUpperCase();
           let correctCount = 0;
           let upperCorrect = 0;
           let lowerCorrect = 0;
           const distractorCounts = { A: 0, B: 0, C: 0, D: 0, E: 0, Lainnya: 0 };

           Object.keys(userAnswersMap).forEach(nis => {
              const ans = userAnswersMap[nis][idx] || userAnswersMap[nis][no] || '';
              let isCorrect = false;
              if (tipe === 'PG_KOMPLEKS') {
                 const kSet = new Set(kunci.split(',').map(s=>s.trim().substring(0,1).toUpperCase()));
                 const uSet = new Set(String(ans).split(',').map(s=>s.trim().substring(0,1).toUpperCase()).filter(Boolean));
                 isCorrect = kSet.size === uSet.size && [...kSet].every(k=>uSet.has(k));
              } else if (tipe === 'BENAR_SALAH' || tipe === 'MENJODOHKAN') {
                 isCorrect = kunci.replace(/\s+/g,'').toUpperCase() === String(ans).replace(/\s+/g,'').toUpperCase();
              } else if (tipe === 'ISIAN') {
                 const ck = kunci.toLowerCase().replace(/[^a-z0-9]/g,'');
                 const ca = String(ans).toLowerCase().replace(/[^a-z0-9]/g,'');
                 isCorrect = ck === ca || (ck.length >= 4 && (ck.includes(ca) || ca.includes(ck)));
              } else {
                 const firstLetter = String(ans).substring(0,1).toUpperCase();
                 isCorrect = firstLetter === kunci.substring(0,1).toUpperCase();
                 if (['A','B','C','D','E'].includes(firstLetter)) distractorCounts[firstLetter]++;
                 else distractorCounts.Lainnya++;
              }

              if (isCorrect) {
                 correctCount++;
                 if (upperNIS.has(nis)) upperCorrect++;
                 if (lowerNIS.has(nis)) lowerCorrect++;
              }
           });

           const tkPercent = Math.round((correctCount / totalStudents) * 100);
           const tkKategori = tkPercent > 70 ? 'Mudah' : (tkPercent < 30 ? 'Sulit' : 'Sedang');
           const dbRaw = groupSize > 0 ? ((upperCorrect - lowerCorrect) / groupSize) : 0;
           const dbValue = parseFloat(dbRaw.toFixed(2));
           const dbKategori = dbValue > 0.3 ? 'Baik' : (dbValue >= 0.1 ? 'Cukup' : 'Kurang/Revisi');

           let distractorSummary = '';
           if (tipe === 'PG') {
              distractorSummary = `A:${distractorCounts.A}, B:${distractorCounts.B}, C:${distractorCounts.C}, D:${distractorCounts.D}, E:${distractorCounts.E}`;
           } else {
              distractorSummary = `Benar: ${correctCount} siswa (${tkPercent}%)`;
           }

           return { no, soal: soalText, tipe, kunci, tkPercent, tkKategori, dbValue, dbKategori, distractorSummary };
        });
      };

                                      img.onload = () => {
                                        const canvas = document.createElement('canvas');
                                        const MAX_WIDTH = 550;
                                        let width = img.width; let height = img.height;

                                        canvas.width = width; canvas.height = height;
                                        const ctx = canvas.getContext('2d');
                                        ctx.drawImage(img, 0, 0, width, height);
                                        const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
                                        setFormSoal(prev => ({ ...prev, soal: prev.soal ? `${prev.soal}\n[img:${dataUrl}]` : `[img:${dataUrl}]` }));

                                      img.src = ev.target.result;
                                    };

                        <div className="bg-slate-50 p-2.5 rounded-xl border">Siswa: <span className={item.isCorrect ? "text-emerald-600 font-black" : "text-rose-600 font-black"}>{item.studentAns}</span></div>
                        <div className="bg-slate-50 p-2.5 rounded-xl border">Kunci: <span className="text-indigo-600 font-black">{item.correctAns}</span></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
